    <meta name="title" property="og:title" content="Network Site Reliability Engineer">
    <meta name="description" property="og:description" content="The Enterprise Network Support and SRE team is looking to add a seasoned Technical SRE lead to help actualize the SRE vision for our network infrastructure. We are looking for an engineer who is passionate about the network and making its operation seamless with a focus on user experience. This role will offer several opportunities to solve problems by being hands-on with troubleshooting, focused on network automation, observability, documentation, and excellence in operations. This Network SRE will be dedicated to enhancing network operations, diligently working to minimize manual labor and achieve Service Level Objectives (SLOs) amongst many goals. Our approach includes minimizing reactive operational tasks, documenting KB articles that can be used by Bots, following through on RCAs, conducting blameless postmortems, and proactively identifying and mitigating network risks to foster continuous improvement. This crucial role will be focused on user satisfaction and brilliance in Network Operations. This SRE engineer will focus on tackling significant projects and is committed to fostering a supportive atmosphere that offers the mentorship necessary for professional development and growth. They will bring a wealth of skills and experience to be a sought after mentor, who leads by example. What you&#39;ll be doing: Owning the operational aspect of the network infrastructure, ensuring its high availability and reliability. Partnering with architecture and deployment teams to guarantee that new implementations are supportable and align with production standards. Advocating for and implementing automation to reduce toil and enhance operational efficiency. Monitoring network performance, identifying areas for improvement, and coordinating with relevant teams to execute enhancements. Collaborating with SMEs to resolve production issues swiftly and effectively, maintaining customer satisfaction. Identifying opportunities for operational improvements and partnering with teams to develop solutions that drive excellence and sustainability in network operations. What we need to see: BS degree in Computer Science, Electrical Engineering, or a related technical field, or equivalent experience. 8+ years of industry experience in network site reliability engineering, network automation, network operations, or related areas. Experience on both campus and data center networks. Familiarity with network management tools such as Prometheus, Grafana, Alert Manager, Nautobot/Netbox, BigPanda Expertise in automating networks using frameworks such as Salt, Ansible, or similar. In depth experience in one or more of the following: Python, Go. Knowledge in network technologies such as TCP/UDP, IPv4/IPv6, Wireless, BGP, VPN, L2 switching, , Firewalls, Load Balancers, EVPN, VxLAN, Segment Routing. Proven track record in network operations. Skills with ServiceNow and Jira Knowledge of Linux system fundamentals is a plus. Systematic problem-solving approach, coupled with excellent communication skills and a sense of ownership and drive. Ways to stand out from the crowd: Track record of taking operational signals through means such as SNMP, Syslog, Streaming Telemetry to solve operational challenges History of debugging and optimizing code; automating routine tasks. Experience with Mellanox/Cumulus Linux, Palo Alto firewalls, Netscalers and F5 load balancers Previous SRE experience NVIDIA is widely considered to be one of the technological world’s most desirable employers. We have some of the most forward-thinking and hardworking people in the world working for us. If you&#39;re creative, and enjoy having fun, then what are you waiting for? Apply today! #LI-Hybrid Your base salary will be determined based on your location, experience, and other objective job-related factors. The expected base salary ranges for this position are: 168,000 USD – 270,250 USD for Level 4; and 208,000 USD – 333,500 USD for Level 5. You will also be eligible for equity and benefits. Applications for this job will be accepted at least until November 8, 2026. This posting is for an existing vacancy. NVIDIA uses AI tools in its recruiting processes. NVIDIA is committed to fostering an inclusive work environment and proud to be an equal opportunity employer. As we highly value diversity in our current and future employees, we do not discriminate (including in our hiring and promotion practices) on the basis of race, religion, color, national origin, gender, gender expression, sexual orientation, age, marital status, veteran status, disability status or any other characteristic protected by law. NVIDIA pioneered accelerated computing. Today, our AI infrastructure powers global intelligence, transforming every industry. Learn more about NVIDIA.">
