name: Form learning
# Weekly: read the form-filling learning digest (the site's /admin/form-filling/digest.json: efficiency per day and release, weaknesses
# ranked by impact with evidence) and ask a small model for the 3 improvements that would remove the most lost questions. Each is filed
# here as an issue (label form-learning) citing the digest's own weakness ids; one still open for the same weaknesses is updated instead.
# One model call, capped by --budget and the relay's call cap. A person decides; nothing is changed automatically.
# Secrets: LAB_KEY (the site's scripts' key).
# No API key (owner, 3 Nov 2026: "We should not use API Keys at all anymore. Everything should be around the ai-broker"): the script runs behind the public repo's AI broker relay (public/desktop/e2e/broker-relay-run.mjs) on this run's OIDC token, on the Codex plan (the scheduled lane: it stops at 70% of the Codex week, web #348); a broker "no" skips the asks with an "AI skipped/failed" annotation and the next run asks again.
# No cost report to /ai-cost (3 Nov 2026): the figures were Haiku list prices of tokens the plan pays for, and /ai-cost would have read them as Anthropic dollars.
# Broker calls a week: one (cap 3).
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      dry: {description: 'Dry run: ask the model, file nothing', required: false, default: 'false'}

permissions:
  contents: read
  issues: write
  id-token: write   # the broker knows a run by its OIDC token (public/desktop/e2e/lib/broker-client.mjs)

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LAB_KEY: ${{ secrets.LAB_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GarryOne/jobadabra
          path: public
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Its own tests
        run: node --test digest/propose.test.mjs lib/messages.test.mjs
      - name: Propose improvements
        shell: bash   # -eo pipefail: a failing job behind `| tee` fails the step (default bash -e returns tee's status)
        run: |
          flags=""
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then flags="--dry"; fi
          node public/desktop/e2e/broker-relay-run.mjs --job form-learning --cap 3 -- node digest/propose.mjs --budget 0.05 --out form-learning.json $flags | tee form-learning.log
      - name: Summary
        if: always()
        run: |
          { echo '### Form learning'; echo; echo '```'; tail -n 30 form-learning.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: form-learning, path: form-learning.json, retention-days: 30, if-no-files-found: ignore}
