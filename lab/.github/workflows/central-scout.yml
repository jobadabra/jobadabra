# Jobadabra — the central scout (21 Oct 2026: moved here from the private jobadabra-lab, whose Actions minutes were not payable;
# public repos run free). It reads the private seed lists and discovery scripts from jobadabra-lab with the CI GitHub App's token.
# Its log is public: employer names and counts only. Runs the PUBLIC engine's source scout once a day with no user's data (no Notion,
# no Telegram), verifies every known feed and uploads the employer index to the website worker
# (PUT https://www.jobadabra.top/api/index). Apps and Always-on runs download it (GET /api/index).
# Secrets: CI_APP_CLIENT_ID (variable)/CI_APP_PRIVATE_KEY (read of the private repo), INDEX_PUBLISH_KEY (= the website worker's secret of the same name; Keychain jobadabra.site.index_publish_key).
# The large-scale discovery is private and lives here (3 Oct 2026): every job board Common Crawl has seen (discovery/commoncrawl.py) and the
# queue ranked by each source's measured yield (discovery/priorities.py). The public engine's AI steps also run here, on the owner's Codex plan through the broker
# (desktop/e2e/broker-relay-run.mjs; no Anthropic key, owner 31 Oct 2026: "We should use fully the Codex"), once for everyone: ideas for new employers (every third day) and reading careers pages the rules cannot (capped per run); the recipes they
# learn travel to every install in the index. When the broker says no (budget, login, down) the AI steps are skipped: green with "AI skipped/failed: <reason>" and one alert.
name: Central scout
run-name: central scout${{ inputs.batch && format(' {0}', inputs.batch) || '' }}

on:
  # Why (2 Nov 2026, rs 6b-4, owner: "jobadabra should have no web, no worker"): the public copy of this job is deleted (jobadabra#2962), so this is the only scheduler.
  # Proven by hand first: run 41376186747, 40 broker calls answered, no oidc error, 3871 feeds published.
  schedule:
    - cron: '20 4,10,16,22 * * *'   # UTC, every 6 h
  workflow_dispatch:
    inputs:
      batch: {description: 'candidates to probe this run', required: false, default: '500'}
      country: {description: 'country for the board pass (a name or code from the pool list, e.g. Moldova); empty = the thinnest not done lately', required: false, default: ''}

permissions:
  contents: read
  id-token: write   # the broker knows a run by its OIDC token (desktop/e2e/lib/broker-client.mjs)

concurrency:
  group: central-scout
  cancel-in-progress: false

env:
  # No user is behind this run: nothing of Notion, Telegram or the AI can start, even if a variable leaks in.
  JOBADABRA_DISABLE: notion,telegram,mail,google_jobs,enrich,score,auto_kits,insights,index
  # Worldwide places (not one user's search): the index serves users everywhere; each app filters by its own search.
  JOBADABRA_LOCATIONS_FILE: config/central_locations.json

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # owner, 24 Oct 2026: 30 minutes so a run reaches more of its feed slice (20 on 23 Oct); the feeds are verified in slices (src/scout_carry.py)
    env:
      SCOUT_MEMORY_URL: https://www.jobadabra.top/api/scout-memory   # the site's private copy of the scout's memory (web#457); the key is INDEX_PUBLISH_KEY, as for the index
      PYTHONUNBUFFERED: '1'   # 22 Oct 2026: a cancelled run lost every line the scout had printed but not flushed ("no log line for 37 min")
    steps:
      - name: When this job started (the scout's deadline counts from here)
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: The public engine (src/, desktop/e2e, the shared actions); this repo is checked out at ops below
        uses: actions/checkout@v5
        with:
          # Why (1 Nov 2026, rs 6b/6): the job moved here from the public repo, so "this repo" is the lab now; the engine is the other checkout. Owner from the variable, never a literal (org move, go-org-move-1e).
          repository: ${{ vars.OWNER_OF_JOBADABRA }}/jobadabra
          ref: main
      - name: This repo (the curated seed lists and the discovery; public since 1 Nov 2026, so no App token)
        uses: actions/checkout@v5
        with:
          path: ops
      - name: Load the private seed lists and starter feeds
        # The starter feeds live here since 6 Oct 2026 (the public config/sources.json is empty): the central index carries them to every
        # install with their places and role mix, so an install never crawls a list baked into it.
        run: |
          cp ops/config/scout_seeds.json config/scout_seeds.json
          cp ops/config/starter_sources.json config/sources.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore the scout's candidate list
        id: candidates
        uses: actions/cache/restore@v5
        with:
          # data/geo.json: where each job place is, judged once by the AI (src/scout_kind_counts.py).
          # Why (5 Nov 2026, jobadabra#2915): keep comments out of `path: |`: text after a path is part of it, so the places were lost after every run.
          path: |
            data/jobs.sqlite
            data/cache
            data/geo.json
          key: central-scout-db-${{ github.run_id }}
          restore-keys: central-scout-db-
      # Why (6 Nov 2026, owner: "Yes, copy it to R2 (Recommended)"; web#457 holds the route): the scout's memory lived only in this repo's GitHub cache, and on 2 Nov a repo move left it behind
      # (6,833 to 3,871 feeds, the title answers lost). The site keeps a private copy (30 days); it comes back from there when the cache found nothing. The cache stays the first home.
      # Replaces the one-time restore of the old path list (#80): run 42118339535 saved under the new list, so the cache is found again.
      # Whatever fails here says one line and never fails the run: the scout then starts from its seed lists, as it did before. A failure shows as a run warning (a rotated key must not hide in a green line); an empty bucket, the normal first run, does not.
      # The read retries twice (Gitar-style review, 6 Nov 2026): one blip would start the scout empty, and the empty start is then cached, so later runs would never ask the site again.
      - name: Restore the scout's memory from the site when the cache was not found
        if: steps.candidates.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 3
        env:
          INDEX_PUBLISH_KEY: ${{ secrets.INDEX_PUBLISH_KEY }}
        run: |
          set +e
          if [ -z "$INDEX_PUBLISH_KEY" ]; then echo "::warning::scout memory: not restored from R2 (no INDEX_PUBLISH_KEY)"; exit 0; fi
          zipped="$RUNNER_TEMP/scout-memory.tgz"; heads="$RUNNER_TEMP/scout-memory.head"; errs="$RUNNER_TEMP/scout-memory.err"
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$INDEX_PUBLISH_KEY" | curl -sS -K - --max-time 50 --retry 2 --retry-delay 2 -D "$heads" -o "$zipped" -w '%{http_code}' "$SCOUT_MEMORY_URL" 2>"$errs")
          status=$?
          code="${code: -3}"
          if [ "$status" != 0 ] || [ "$code" != 200 ]; then
            if [ "$code" = 200 ]; then detail="curl exit $status $(head -c 200 "$errs" 2>/dev/null)"; else detail="$(head -c 200 "$zipped" 2>/dev/null)$(head -c 200 "$errs" 2>/dev/null)"; fi
            detail=$(printf '%s' "$detail" | tr '\n\r' '  ')
            mark="::warning::"; case "$detail" in *'none saved'*) mark="";; esac
            echo "${mark}scout memory: not restored from R2 (HTTP ${code:-none}: $detail)"
            exit 0
          fi
          unpacked=$(mktemp -d)
          if tar -xzf "$zipped" -C "$unpacked" 2>/dev/null && mkdir -p data && cp -a "$unpacked"/. data/; then
            echo "scout memory: restored from R2 $(grep -i '^x-scout-memory:' "$heads" | tr -d '\r' | cut -d' ' -f2 | cut -c1-10)"
          else
            echo "::warning::scout memory: not restored from R2 (the copy did not unpack)"
          fi
          exit 0
      - name: Install the AI library and the headless browser
        continue-on-error: true
        run: pip install --quiet -r requirements.txt -r requirements-render.txt
      - name: Chromium for the render (cached)
        continue-on-error: true
        uses: ./.github/actions/playwright-browser
        with: {runtime: python, mode: both}
      - name: Every job board Common Crawl has seen (once per new crawl)
        continue-on-error: true   # the archive being slow must never cost the day's index
        timeout-minutes: 6   # 24 Oct 2026: 6 of the job's 30 minutes (was 3; its listings are saved one by one, so a slow archive costs nothing already read). 21 Oct 2026: its index answered 504 to every query and the retries took 27 min, twice; the crawl is only marked read when every query answers
        run: python ops/discovery/commoncrawl.py --db data/jobs.sqlite
      - name: Rank the queue by each source's measured yield
        run: python ops/discovery/priorities.py --db data/jobs.sqlite
      - name: Save the candidate list now (Common Crawl's 27 min must not be paid again if this run is cancelled; 22 Oct 2026)
        uses: actions/cache/save@v5
        with:
          path: |
            data/jobs.sqlite
            data/cache
            data/geo.json
          key: central-scout-db-early-${{ github.run_id }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Scout and publish the index
        id: scout
        env:
          INDEX_PUBLISH_KEY: ${{ secrets.INDEX_PUBLISH_KEY }}
          # Why (5 Nov 2026, owner: "200 a run, after a fix"): a run asks at most 200 broker calls (about 10,000 items), which sorts the employers still without a kind in about 6 days; items past it stay unjudged, never defaulted. Web#448 stops these calls reaching the Claude plan past the 70% line, so this cap is no longer the only brake.
          CENTRAL_AI_CAP: '200'
          BATCH: ${{ inputs.batch || '500' }}
          SCOUT_TITLE_KINDS: ops/config/title_kinds.json.gz   # titles judged on the owner's Claude plan (tools/recount_title_kinds.py); absent: nothing changes
          SCOUT_BOARD_COUNTRY: ${{ inputs.country }}
          SCOUT_SERPAPI_KEY: ${{ secrets.CENTRAL_SCOUT_SERPAPI_KEY }}   # Google results for the board pass, under its own caps (src/scout_google_boards.py); never as SERPAPI_API_KEY
        run: node desktop/e2e/broker-relay-run.mjs --job central-scout --cap "$CENTRAL_AI_CAP" -- python -m src scout --batch "$BATCH" --publish-index
      - name: Tell the owner once if Codex refused or a call failed (the AI judgments wait, nothing is paid)
        if: always() && steps.scout.outputs.skipped == 'true'
        uses: ./.github/actions/ai-skipped-alert
        with:
          bot-token: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          github-token: ${{ github.token }}
          notes-dir: ${{ runner.temp }}/ai-capped
      - name: Tell the owner when it fails
        if: failure()
        env:
          BOT: ${{ secrets.BRAIN_BOT_TOKEN }}
          CHAT: ${{ secrets.BRAIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$BOT" ] && [ -n "$CHAT" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=❌ Central scout failed, the employer index is not updated: ${RUN_URL}" > /dev/null
      - name: Save the scout's candidate list
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/jobs.sqlite
            data/cache
            data/geo.json
          key: central-scout-db-${{ github.run_id }}
      # Why (6 Nov 2026, owner: "Yes, copy it to R2 (Recommended)"): the same three things the cache keeps, as one gzipped tar, after every run and also when a later step failed, as the cache save does.
      # The site refuses a save under half its newest copy (a scout that started empty must not replace a good memory) and drops copies older than 30 days; a refusal says one line here and never fails the run.
      - name: Save the scout's memory to the site
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          INDEX_PUBLISH_KEY: ${{ secrets.INDEX_PUBLISH_KEY }}
        run: |
          set +e
          if [ -z "$INDEX_PUBLISH_KEY" ]; then echo "::warning::scout memory: not saved to R2 (no INDEX_PUBLISH_KEY)"; exit 0; fi
          keep=()
          for name in jobs.sqlite cache geo.json; do [ -e "data/$name" ] && keep+=("$name"); done
          if [ "${#keep[@]}" = 0 ]; then echo "scout memory: not saved to R2 (no data folder)"; exit 0; fi
          zipped="$RUNNER_TEMP/scout-memory-save.tgz"; answer="$RUNNER_TEMP/scout-memory-save.answer"; errs="$RUNNER_TEMP/scout-memory-save.err"
          if ! tar -czf "$zipped" -C data "${keep[@]}"; then echo "::warning::scout memory: not saved to R2 (the tar failed)"; exit 0; fi
          bytes=$(wc -c < "$zipped" | tr -d ' ')
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$INDEX_PUBLISH_KEY" | curl -sS -K - --max-time 120 -T "$zipped" -H 'Content-Type: application/gzip' -o "$answer" -w '%{http_code}' "$SCOUT_MEMORY_URL?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>"$errs")
          status=$?
          code="${code: -3}"
          if [ "$status" = 0 ] && [ "$code" = 200 ]; then
            echo "scout memory: saved to R2 $bytes bytes"
          else
            detail=$(printf '%s%s' "$(head -c 200 "$answer" 2>/dev/null)" "$(head -c 200 "$errs" 2>/dev/null)" | tr '\n\r' '  ')
            echo "::warning::scout memory: not saved to R2 (HTTP ${code:-none}: $detail)"
          fi
          exit 0
