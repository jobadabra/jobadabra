name: Publish playbooks
# The private per-board notes for Claude's application sessions (playbooks/apply/<board>.md) go to the website on every change, where
# the public engine's `apply_run --context` fetches them (one board at a time, installs with a token only).
# Secret: LAB_KEY (the site's STATS_KEY).
on:
  push:
    branches: [main]
    paths: ['playbooks/**', '.github/workflows/playbooks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAB_KEY: ${{ secrets.LAB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node playbooks/publish.mjs
