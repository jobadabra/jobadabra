name: Recipe proposer
# Daily, after the form lab: for the controls that fail (for users or in the lab) and have no recipe yet, ask a small model for a recipe,
# check it with the extension's own validator, and file it as a CANDIDATE on the site. The form lab tries candidates on real public
# pages the next morning and the canary rolls out the ones that work. Capped at --max controls and --budget dollars per run.
# Lives in this private repo because the method and its prompt are part of the product's intelligence.
# Secrets: LAB_KEY (the site's STATS_KEY).
# No API key (owner, 3 Nov 2026: "We should not use API Keys at all anymore. Everything should be around the ai-broker"): the script runs behind the public repo's AI broker relay (public/desktop/e2e/broker-relay-run.mjs) on this run's OIDC token, on the Codex plan (the scheduled lane: it stops at 70% of the Codex week, web #348); a broker "no" skips the asks with an "AI skipped/failed" annotation and the next run asks again.
# No cost report to /ai-cost (3 Nov 2026): the figures were Haiku list prices of tokens the plan pays for, and /ai-cost would have read them as Anthropic dollars.
# Broker calls a day: one per control, at most --max (20, cap 25), so at most 25 a day.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      dry: {description: 'Dry run: ask the model, file nothing', required: false, default: 'false'}
      max: {description: 'Most controls to work on', required: false, default: '20'}

permissions:
  contents: read
  id-token: write   # the broker knows a run by its OIDC token (public/desktop/e2e/lib/broker-client.mjs)

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAB_KEY: ${{ secrets.LAB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GarryOne/jobadabra
          path: public
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: The proposer's own tests
        run: node --test proposer/proposer.test.mjs teach/teach.test.mjs lib/messages.test.mjs
      - name: Propose recipes
        shell: bash   # -eo pipefail: a failing job behind `| tee` fails the step (default bash -e returns tee's status)
        run: |
          flags=""
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then flags="--dry"; fi
          node public/desktop/e2e/broker-relay-run.mjs --job recipe-proposer --cap 25 -- node proposer/proposer.mjs --extension public/extension --max "${{ github.event.inputs.max || '20' }}" --budget 0.5 --out proposer-result.json $flags | tee proposer.log
      - name: Summary
        if: always()
        run: |
          { echo '### Recipe proposer'; echo; echo '```'; tail -n 40 proposer.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: proposer-result, path: proposer-result.json, retention-days: 14, if-no-files-found: ignore}
