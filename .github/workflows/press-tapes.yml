name: Press tapes
# The press's yardstick (plan docs/superpowers/plans/2026-11-07-the-press.md 2b): each night persona's first and repeat press recorded once with a longer
# press (the ceiling, tools/persona-search/run.mjs --ceiling), every web and AI answer kept (src/search_tape.py, per item: src/tape_items.py), then
# published encrypted on jobadabra-lab's release `search-tapes` (tools/persona-search/tape-store.mjs). By hand only; plan path through the Codex broker ($0).
# Its calls ride the broker's by-hand lane (jobadabra-web lib/lanes.mjs: the PR reserve to 100% of the week, never Claude), so a spent scheduled share (70%) no longer turns a tape into another AI's answers.
# That lane has 800 calls a UTC day, shared with by-hand Search checks; past it every call is refused (429, no other AI). A persona's two 180 s presses took 87-91 calls (8 Nov 2026);
# at the 540 s ceiling it is not measured yet, so each persona starts only with room on its lane (by hand: 300 calls left today; scheduled, from 11 Nov: the week under 66%), and a tape with any refused or Free AI call is not published.
on:
  workflow_dispatch:
    inputs:
      personas:
        description: 'JSON list of personas, such as [10, 11] (by-hand lane: 1 to 4; scheduled: 1 to 12)'
        type: string
        required: true
      # Why (8 Nov 2026, owner: "By hand until 11 Nov, rest after reset (Recommended)": "2-4 a day now… then the remaining ~10 in one go on the scheduled share right after 11 Nov 09:41"):
      # by-hand rides the PR reserve under 800 calls a UTC day; scheduled names no environment, so the broker puts it on the scheduled lane (70% of a fresh Codex week).
      lane:
        description: 'Broker lane: byhand (until the Codex week resets, 800 calls a UTC day) or scheduled (after the reset)'
        type: choice
        options: ['byhand', 'scheduled']
        default: 'byhand'
      ceiling:
        description: 'Seconds of the recorded press (180 = a normal press)'
        type: string
        default: '540'   # Why (7 Nov 2026, owner: "3× press, one at a time (Recommended)"): ~6 h for the 18, off the night check's broker time

permissions:
  contents: read

concurrency:   # the night check's group: a recording never shares the broker with it (its refusals would be recorded into the tape)
  group: search-personas
  cancel-in-progress: false

env:
  CI_AI_PROVIDER: codex
  E2E_AI_PROVIDER: codex
  JOBADABRA_AI_CALL_LOG: '1'
  JOBADABRA_MODEL_OVERRIDE: claude-haiku-5-5

jobs:
  # Why (8 Nov 2026, Gitar on #3586): a comment did not stop a dispatch of all 18 (~810+ calls) running into the lane's 800 a day, where every later call is refused and recorded into a tape.
  batch:
    name: The batch fits the by-hand lane's day
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          PERSONAS: ${{ inputs.personas }}
          MAX: ${{ inputs.lane == 'scheduled' && '12' || '4' }}
        run: |
          n=$(node -e 'const v = JSON.parse(process.env.PERSONAS || "[]"); if (!Array.isArray(v) || !v.every(Number.isInteger)) process.exit(2); console.log(v.length)') || { echo "::error::personas must be a JSON list of numbers"; exit 1; }
          if [ "$n" -lt 1 ] || [ "$n" -gt "$MAX" ]; then echo "::error::name 1 to $MAX personas on the ${{ inputs.lane }} lane (a recording takes ~300 calls), got $n"; exit 1; fi

  record:
    name: Tape ${{ matrix.persona }}
    needs: batch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Why (8 Nov 2026, owner: "Yes, tapes use it too (Recommended)": "gi adds the same environment to press-tapes.yml plus one name in lanes.mjs"): the run token's environment puts these calls
    # on the broker's by-hand lane (jobadabra-web lib/lanes.mjs); without it a recording lands on the scheduled lane, spent this week (7 Nov: 503s to Free AI). No deployment record: it deploys nothing.
    environment:
      name: ${{ inputs.lane != 'scheduled' && 'search-check-by-hand' || '' }}
      deployment: false
    permissions:
      contents: read
      id-token: write   # the Codex broker: GitHub OIDC, no stored secret
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time: the broker refuses calls under load, and a refusal recorded in a tape skews its times (owner, 7 Nov 2026)
      matrix:
        persona: ${{ fromJSON(inputs.personas) }}
    steps:
      # Why (8 Nov 2026, coordinator mac-9d: "A tape with a refused call must fail its own recording, never be kept"): a 540 s recording's call count is not measured yet (two 180 s presses: 87-91 calls,
      # run 42451932088), so a persona starts only while the by-hand lane has room for 3x that today; one that does not fit stops here, red, before any AI call, and is recorded another day.
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      # Why (8 Nov 2026, mac-9d; Gitar on #3589): a recording starts only when the broker says its lane has room, and an unread count is no room (tools/persona-search/recording_room.py).
      - name: The broker lane has room for this recording
        run: |
          set -o pipefail
          curl -fsS --max-time 20 https://jobadabra-ai-broker.jobpilotto.workers.dev/health | python3 tools/persona-search/recording_room.py "${{ inputs.lane }}" 4 300
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Electron's zip from the cache (a GitHub 504 only hits a cold cache)
        timeout-minutes: 5
        uses: ./.github/actions/electron-cache
      - name: The engine, the app's libraries and a browser
        run: |
          pip install --quiet -r requirements.txt
          (cd desktop && npm ci && node scripts/stage.mjs --files-only)
          (cd desktop/e2e && (npm ci || npm install))
      - uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e, mode: both}
      - name: Record a first and a repeat press
        env:
          JOBADABRA_TAPE_ITEMS: '1'
          CEILING: ${{ inputs.ceiling }}
        run: |
          set -o pipefail
          case "$CEILING" in ''|*[!0-9]*) echo "::error::ceiling must be whole seconds, got '$CEILING'"; exit 1;; esac
          python3 tools/persona-search/gate.py cv "${{ matrix.persona }}" out
          node tools/persona-search/codex.mjs -- node tools/persona-search/run.mjs draw "$GITHUB_WORKSPACE/out" --presses 2 --fresh --engine api --tag tape \
            --tape "$GITHUB_WORKSPACE/tape" --record --ceiling "$CEILING" 2>&1 | tee out/run.log
          cp out/draw/draft.json tape/draft.json
      - name: Judge the ceiling's jobs (kept with the tape)
        # The yardstick's PR job runs no AI (plan docs/superpowers/plans/2026-11-07-the-press.md 2c): the blind judge's verdicts on every job the ceiling
        # found, and each press's jobs in the places (run.mjs --tape: jobs-<press>.json), travel with the tape for tools/press-yardstick/three_numbers.py.
        run: |
          set -o pipefail
          python3 tools/persona-search/gate.py extract "$(node -p 'require("os").tmpdir()')/jp-persona-draw-tape/data/jobs.sqlite" out/jobs.json
          node tools/persona-search/codex.mjs -- python3 tools/persona-search/gate_judge.py "${{ matrix.persona }}" out/jobs.json tape/judged.json 2>&1 | tee out/judge.log
          cp out/draw/jobs-*.json tape/
      # Why (8 Nov 2026, coordinator mac-9d: "A tape with a refused call must fail its own recording, never be kept"): a refused call (429 past the day cap, a 503) or a Free AI answer is
      # another clock and another model in the tape, so the yardstick would count it as the press's own.
      - name: Every AI call was answered by Codex (else the tape is not kept)
        run: |
          calls=$(cat out/run.log out/judge.log | grep -c 'relay: ' || true)
          refused=$(cat out/run.log out/judge.log | grep 'relay: ' | grep -vc ' status 200 ' || true)
          # Why (8 Nov 2026, Gitar on #3589): a fallback answer is still status 200; only the broker client's "AI: <engine> / <model> (<fell back from>)" line, printed once per distinct
          # engine (desktop/e2e/lib/broker-client.mjs aiLine), names who answered. Codex or Claude is a real answer (owner, 8 Nov 2026: "codex up to 100%, Claude up to 90%"); Free AI is not.
          other=$(cat out/run.log out/judge.log | grep -E '^AI: ' | grep -vcE '^AI: (codex|claude)( / [^(]*)?( \([^)]*\))?$' || true)
          seen=$(cat out/run.log out/judge.log | grep -cE '^AI: (codex|claude)' || true)
          echo "AI calls: $calls, not answered: $refused, answer lines from Free AI or another engine: $other"
          if [ "$calls" -eq 0 ] || [ "$seen" -eq 0 ] || [ "$refused" -ne 0 ] || [ "$other" -ne 0 ]; then echo "::error::persona ${{ matrix.persona }}'s tape has refused or other-AI calls: not published"; exit 1; fi
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old write token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ vars.OWNER_OF_LAB || github.repository_owner }}
          repositories: jobadabra-lab
      - name: Publish the tape (encrypted)
        env:
          GH_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_WRITE_TOKEN }}
        run: node tools/persona-search/tape-store.mjs publish "night-p${{ matrix.persona }}" "$GITHUB_WORKSPACE/tape"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: press-tape-log-p${{ matrix.persona }}
          retention-days: 14
          path: |
            out/run.log
            out/judge.log
            out/draw/presses.jsonl
            out/draw/run-*.log
