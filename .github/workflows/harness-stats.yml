name: CI · Agent harness stats
# The numbers behind https://www.jobadabra.top/admin/ai/harness (tab "Agent harness", owner, 4 Nov 2026: "details about each run. What happened. Some logs, some achievements, errors"):
# the CI fixer's plan rows, the context layers and sources (file facts), and the run record of each "CI · AI fixer" run of the last 30 days (tools/harness-stats.mjs). Report only: it never blocks anything. No AI, $0.
# Daily (after agent-coding-stats.yml's 04:41) and when an AI fixer run completes, so a run shows on the page within minutes. A run that wrote no record is normal and skipped; the site answers 400 for this kind until
# its page is deployed: that is a notice here, never a red run. The workflow reads artifacts as data: it checks out the default branch (never the fixer run's branch) and runs only that branch's script.
on:
  schedule:
    - cron: '53 4 * * *'
  workflow_run:
    workflows: ['CI · AI fixer']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read         # the run list and the artifact `ai-fixer-record`
  pull-requests: read   # the plan's PRs

concurrency:
  group: harness-stats   # one at a time: the card is replaced by the day, so a queued run loses nothing
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read the plan, the layers and the run records
        run: node tools/harness-stats.mjs --out "$RUNNER_TEMP/harness.json"
      - name: Store it for the admin page
        run: |
          if [ -z "$SELFHEAL_PUBLISH_KEY" ] || [ ! -s "$RUNNER_TEMP/harness.json" ]; then
            echo "::notice::Nothing stored (no key, or no harness numbers)."
            exit 0
          fi
          # Why (4 Nov 2026, owner's coordinator): the site answers 400 for kind "harness" until its page is merged and deployed; a notice, not a red run (a report, like the other stats uploads).
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer ${SELFHEAL_PUBLISH_KEY}" --data-binary "@$RUNNER_TEMP/harness.json" "https://www.jobadabra.top/agent-coding/data" || echo 000)
          if [ "$code" = 200 ]; then echo "Stored."; else echo "::notice::The site did not store the harness numbers (HTTP $code): its page may not be deployed yet."; fi
