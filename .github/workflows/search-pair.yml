name: CI · Search pair (a PR's before/after, by hand)
# By hand: any session proves its own Find jobs PR. For each person named (the 18 night people as 1-18, the profiles by id), main and the PR head search at the same
# minute on one runner (two checkouts, two first searches started together, the same strategy draft), the same blind judge counts their right jobs, and one comment on
# the PR gives the before/after table and a ready "Moves:" line. A PR that changes the strategy draft's producer drafts per side and searches twice a side.
# Why (13 Nov 2026, owner: "But why sessions don't know to do this by themselves. No skill is telling them to do this. No PR CI guardrail is requested them a
# before/after"; asked via AskUserQuestion by sa: "Self-serve workflow + tighter check (Recommended)"): before/after searches went through one session's queue.
# Its turn: the `turn` job claims 2 searches per person at the broker and waits its place in line (up to 55 min; tools/persona-search/claim.py, the broker's
# lib/claims.mjs: first come, first served, each run only what it needs; owner via sa, 13 Nov 2026); each pair job renews it, `release` gives it back. Pairs of several PRs
# run side by side while the room holds them (owner, 12 Nov: "it should be in parallel"). A side whose broker wait p90 is over 20 s is not counted.
# Never a night, never red on the PR, no floors, no scoreboard change; fictional people only; plan AI through the broker (OIDC), nothing paid; the PR's own branch only.
#   gh workflow run search-pair.yml -f pr=<n> -f people='[3, "b02"]'
# Broker lane: by-hand (jobadabra-web workers/ai-broker/lib/lanes.mjs lists search-pair.yml).
run-name: 'Search pair · #${{ inputs.pr }} · ${{ inputs.people }} · ${{ inputs.tiers }} tier'

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'The PR number (a branch of this repo, not a fork)'
        type: string
        required: true
      people:
        description: 'Up to 3: night people 1-18 and profile ids, a JSON list such as [3] or [3, "b02"]'
        type: string
        required: true
      tiers:
        description: "The AI tiers: app (each step its own tier, as in the app) or small (every search step on the small tier, a comparison the owner asks for)"
        type: choice
        options: ['app', 'small']
        default: 'app'
      attempt:
        description: "1, or 2 when the pair itself ran again for a side that was not valid (a held PR's pair runs once more, then reports)"
        type: string
        default: '1'

# Why (Gitar on #3957): per PR and its people, since GitHub keeps one pending run per group: another PR, or other people of the same PR, never replace a waiting pair;
# the same people again (a side not counted, "start the pair again") replace only their own pending run.
concurrency:
  group: search-pair-${{ inputs.pr }}-${{ inputs.people }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_AI_PROVIDER: codex
  E2E_AI_PROVIDER: codex
  JOBADABRA_CHECK_CHAIN: codex,claude
  JOBADABRA_SEARCH_TIER: ${{ inputs.tiers }}   # a label only (gate.py); the override below is what moves the steps
  # app: no override, each search step on the tier it names, as in the app (owner, 13 Nov 2026, "All but the replays (Recommended)"); small: every step on the small
  # model (an empty value is no override: desktop/lib/pipeline-env.js reads it as unset). The judge never reads it.
  JOBADABRA_MODEL_OVERRIDE: ${{ inputs.tiers == 'small' && 'claude-haiku-5-5' || '' }}

jobs:
  setup:
    name: The PR, its two commits and its people
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: write   # the "Search pair" entry in the PR's checks list (never required, never red)
    outputs:
      people: ${{ steps.people.outputs.people }}
      need: ${{ steps.people.outputs.need }}
      main: ${{ steps.refs.outputs.main }}
      head: ${{ steps.refs.outputs.head }}
      status_sha: ${{ steps.refs.outputs.status_sha }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: The PR's head and the main commit it sits on, fixed now (a branch of this repo only)
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "pr: a number"; exit 1; }
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,isCrossRepository,state,mergeCommit > pr.json
          python3 -c "import json,sys; d=json.load(open('pr.json')); sys.exit('a fork PR is not run (its code would get the broker)' if d['isCrossRepository'] else 'the PR is closed unmerged' if d['state'] not in ('OPEN', 'MERGED') else 0)"
          head=$(python3 -c "import json; print(json.load(open('pr.json'))['headRefOid'])")
          echo "head=$head" >> "$GITHUB_OUTPUT"
          # Why (13 Nov 2026, Gitar on #4033): a squash-merged PR's head is off main, so its "Search pair" status goes on the merge commit instead
          echo "status_sha=$(python3 -c "import json; d=json.load(open('pr.json')); print((d.get('mergeCommit') or {}).get('oid') or d['headRefOid'])")" >> "$GITHUB_OUTPUT"
          # Why (13 Nov 2026, #3946's pair): the "before" side is the main commit the PR sits on, not main's newest; a PR behind main would otherwise be compared
          # with everything merged since, and its own change could not be told apart (main 7e5ee877 against a branch on f86251e3 also differed by #3952 and two more).
          echo "main=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$head" --jq .merge_base_commit.sha)" >> "$GITHUB_OUTPUT"
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > changed.txt
      - name: The people (night 1-18 and profile ids, at most 3)
        id: people
        env:
          PEOPLE: ${{ inputs.people }}
        run: python3 tools/persona-search/pair.py people "$PEOPLE" changed.txt >> "$GITHUB_OUTPUT"
      - name: "The PR's checks list: waiting for room"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.refs.outputs.status_sha }}
          PEOPLE: ${{ steps.people.outputs.people }}
        # Why (13 Nov 2026, owner on #4022: "Can't we link the PR as a PR CI check?" · "So that I see what's going on"): a commit status on the head the pair measures, linking this run.
        # A status (not a check run): its text shows in the checks list; it is never failure, so the PR never turns red and "All checks passed" (tools/pr-verdict.py counts workflow runs) does not read it.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending -f context='Search pair' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="$(echo "$PEOPLE" | jq -r '[.[].id] | join(", ")'): waiting for room at the broker" >/dev/null

  turn:
    name: Claim room at the broker
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    permissions:
      contents: read
      id-token: write   # the broker names the claim from this run's token
      statuses: write   # "Search pair": searching, once the room is ours
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Wait our place in line for the searches we run at once
        env:
          NEED: ${{ needs.setup.outputs.need }}
        run: python3 tools/persona-search/claim.py wait "$NEED"
      - name: "The PR's checks list: searching"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ needs.setup.outputs.status_sha }}
          PEOPLE: ${{ needs.setup.outputs.people }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending -f context='Search pair' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="$(echo "$PEOPLE" | jq -r '[.[].id] | join(", ")'): searching main and the PR" >/dev/null

  pair:
    name: Pair ${{ matrix.person.id }}
    needs: [setup, turn]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: search-check-by-hand
      deployment: false
    permissions:
      contents: read
      id-token: write   # Existing broker authentication: GitHub OIDC, no stored secret.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        person: ${{ fromJSON(needs.setup.outputs.people) }}
    steps:
      - uses: actions/checkout@v5   # the tools (relay, judge, pair.py) from the dispatched ref: the same for both sides
        with: {persist-credentials: false}
      - name: Keep the run's claim while this person searches
        # Why (13 Nov 2026): the broker drops a claim after 10 min without an ask; a person's job takes ~7 min after the grant, its judge longer on a slow day.
        #   The relay (codex.mjs) holds the same run token for the whole job, so this renewer adds no reach. The runner ends it with the job.
        env:
          NEED: ${{ needs.setup.outputs.need }}
        run: mkdir -p out && nohup python3 tools/persona-search/claim.py hold "$NEED" > "out/claim-hold-${{ matrix.person.id }}.log" 2>&1 &   # uploaded with out/; the judge step shows it
      - uses: actions/checkout@v5
        with: {persist-credentials: false, ref: '${{ needs.setup.outputs.main }}', path: side-main}
      - uses: actions/checkout@v5
        with: {persist-credentials: false, ref: '${{ needs.setup.outputs.head }}', path: side-pr}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Electron's zip from the cache
        timeout-minutes: 5
        uses: ./.github/actions/electron-cache
      - name: Both sides' engine and app libraries (each side its own), the relay's
        # Why (Gitar on #3957): the PR's install scripts (npm lifecycle, pip) run without the run-token variables; the PR's search runs only under codex.mjs, which
        # drops them from its child (codex.mjs runOnCodex). The broker already answers any branch of this repo (its PR lane), so this adds no reach, only less of it.
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          echo "setup_start=$(date +%s)" >> times.env
          pip install --quiet -r side-main/requirements.txt -r side-pr/requirements.txt -r requirements-render.txt
          (cd desktop/e2e && (npm ci || npm install))   # the Codex relay (codex.mjs) comes from the tools' checkout
          # each side's API engine imports its desktop/shared/app-core/ai.js, which stage.mjs generates (#2259)
          # Why (13 Nov 2026, run 43357552419): the relay reads the CV's PDF with desktop's pdfjs-dist (desktop/e2e/lib/broker-relay.mjs); without the tools' own desktop
          #   install every AI call of the draft was a 502 "Cannot find package 'pdfjs-dist'". Installed beside the two sides, so it adds no wall time.
          pids=()
          ( cd desktop && npm ci ) & pids+=($!)
          for side in side-main side-pr; do ( cd "$side/desktop" && npm ci && node scripts/stage.mjs --files-only && cd e2e && (npm ci || npm install) ) & pids+=($!); done
          for pid in "${pids[@]}"; do wait "$pid"; done   # a bare `wait` would hide a failed install
      - name: The browser (cached)
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e, mode: both}
      - name: Chromium for the engine's renderer (cached; script-built job boards, as the app reads them)
        uses: ./.github/actions/playwright-browser
        with: {runtime: python, mode: both}
      - name: The person's fictional CV and its one strategy draft
        env:
          KIND: ${{ matrix.person.kind }}
          N: ${{ matrix.person.n }}
          ID: ${{ matrix.person.id }}
          OWN: ${{ matrix.person.own_draft }}
        run: |
          set -euo pipefail
          echo "draft_start=$(date +%s)" >> times.env
          mkdir -p cv
          if [ "$KIND" = night ]; then python3 tools/persona-search/gate.py cv "$N" cv; else python3 tools/persona-search/profiles.py cv "$ID" cv; fi
          if [ "$OWN" != true ]; then
            # Why (13 Nov 2026, sa and bl, run 43487528056): the board proposal and the board searches in local words were one AI call per side, so the sides read different boards (main's
            # side read a board that gave 19 of its 26 right jobs, the PR's never saw it). --propose asks them once here, in the draft's install, and each side starts from a copy of it (below).
            # The run.mjs that has --propose is main's once this has landed; until then the PR's own, and the PR's own when it changes propose.py (13 Nov 2026, the web search made once: its proof needs the PR's).
            drafter=side-main; grep -q -- '--propose' side-main/tools/persona-search/run.mjs || drafter=side-pr
            cmp -s side-main/tools/persona-search/propose.py side-pr/tools/persona-search/propose.py || drafter=side-pr
            node tools/persona-search/codex.mjs -- node "$drafter/tools/persona-search/run.mjs" draw "$GITHUB_WORKSPACE/cv" --presses 0 --fresh --engine api --tag pair-draft --propose 2>&1 | tee draft.log
          fi
      - name: Main and the PR search at the same minute (first search, the person's tier, through the Codex relay)
        env:
          RUNS: ${{ matrix.person.runs }}
          OWN: ${{ matrix.person.own_draft }}
        run: |
          set -uo pipefail
          echo "press_start=$(date +%s)" >> times.env
          # run.mjs works in <tmpdir>/jp-persona-draw-<tag> and --fresh empties it: the two sides run at once on this runner, so their tags must differ (pair-main, pair-pr),
          # and each round's jobs are read (gate.py extract) before the next round's --fresh. Each person is its own runner.
          for k in $(seq 1 "$RUNS"); do
            for side in main pr; do
              out="out/${{ matrix.person.id }}--$side-$k"; mkdir -p "$out/draw"; cp cv/draw/cv.pdf cv/draw/cv.md cv/draw/draw.json "$out/draw/"
              tmp="$(node -p 'require("os").tmpdir()')"; draft=(); fresh=(--fresh)
              if [ "$OWN" != true ]; then
                draft=(--draft "$GITHUB_WORKSPACE/cv/draw/draft.json")
                # both sides start from a copy of the draft's install (strategy, places, board proposal, board searches): no AI question the draft already asked is asked again by a side
                rm -rf "$tmp/jp-persona-draw-pair-$side"; cp -a "$tmp/jp-persona-draw-pair-draft" "$tmp/jp-persona-draw-pair-$side"; fresh=()
                [ -f "$tmp/jp-persona-draw-pair-draft/data/proposed.ok" ] && [ -f "$tmp/jp-persona-draw-pair-draft/data/web-shared.ok" ] || touch "$out/boards-not-shared"   # the draft's proposal or its one web search failed (propose.py writes web-shared.ok): this side asks for itself, and the table says it is not counted
              fi
              node tools/persona-search/codex.mjs -- node "side-$side/tools/persona-search/run.mjs" draw "$GITHUB_WORKSPACE/$out" --presses 1 --first-only "${fresh[@]}" --engine api --tag "pair-$side" "${draft[@]}" > "$out/run.log" 2>&1 &
            done
            wait
            for side in main pr; do
              out="out/${{ matrix.person.id }}--$side-$k"
              python3 tools/persona-search/gate.py extract "$(node -p 'require("os").tmpdir()')/jp-persona-draw-pair-$side/data/jobs.sqlite" "$out/jobs.json" || echo '[]' > "$out/jobs.json"
            done
          done
      - name: The blind judge, the same for both sides (right role, right place; 3 answers, the majority counts)
        env:
          KIND: ${{ matrix.person.kind }}
          N: ${{ matrix.person.n }}
          ID: ${{ matrix.person.id }}
          OWN: ${{ matrix.person.own_draft }}
        run: |
          set -uo pipefail
          echo "judge_start=$(date +%s)" >> times.env
          for out in out/*--*; do
            if [ "$KIND" = night ]; then node tools/persona-search/codex.mjs -- python3 tools/persona-search/gate_judge.py "$N" "$out/jobs.json" "$out/judged.json" > "$out/judge.log" 2>&1
            else node tools/persona-search/codex.mjs -- python3 tools/persona-search/profiles.py judge "$ID" "$out/jobs.json" "$out/judged.json" > "$out/judge.log" 2>&1; fi
            python3 tools/persona-search/pair.py side "$out" "$(basename "$out" | sed -E 's/.*--(main|pr)-[0-9]+$/\1/')"
            printf '{"own_draft": %s}\n' "$OWN" > "$out/person.json"
          done
          echo "end=$(date +%s)" >> times.env
          python3 tools/persona-search/pair.py minutes times.env "${{ matrix.person.id }}" out >> "$GITHUB_STEP_SUMMARY"
          if [ -s "out/claim-hold-${{ matrix.person.id }}.log" ]; then { echo "Claim not held all the way (searches may have run without room):"; echo '```'; cat "out/claim-hold-${{ matrix.person.id }}.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: search-pair-${{ matrix.person.id }}
          retention-days: 30
          path: out/

  release:
    name: Give the room back
    needs: [turn, pair]
    if: ${{ always() }}   # also after a failed or cancelled person; a claim nobody renews frees itself in 10 min anyway
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: python3 tools/persona-search/claim.py release

  comment:
    name: The table on the PR
    needs: [setup, pair]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}   # a cancelled run left an empty table on #3946 (13 Nov 2026): the run that replaced it writes its own
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      status: ${{ steps.table.outputs.status }}   # the numbers, for the PR's checks list (the closing job)
    permissions:
      contents: read
      pull-requests: write
      issues: write    # the "search-hold" label of a PR ship held (tools/ship-search-hold.sh)
      actions: write   # a held PR's pair runs once more for a side that was not valid
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v7
        with: {pattern: 'search-pair-*', path: dl, merge-multiple: true}
      - name: One comment, updated in place
        id: table
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          MAIN: ${{ needs.setup.outputs.main }}
          HEAD: ${{ needs.setup.outputs.head }}
          PEOPLE: ${{ needs.setup.outputs.people }}
          ATTEMPT: ${{ inputs.attempt }}
          TIERS: ${{ inputs.tiers }}
        run: |
          set -euo pipefail
          python3 tools/persona-search/pair.py table dl "$PR" "$MAIN" "$HEAD" > table.md
          # The hold (plan 4/4, pair.py settle): the numbers go into the body's pending Moves lines; ship's own hold (label search-hold) comes off only when none fell.
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels,headRefOid > view.json
          if [ "$(jq -r .headRefOid view.json)" != "$HEAD" ]; then
            { echo; echo "The PR has a newer head than this pair measured: its numbers are not written into the body."; } >> table.md
          else
            python3 tools/persona-search/pair.py settle dl view.json "$ATTEMPT" "$PEOPLE" > verdict.txt
            jq -n --slurpfile s settle.json '{title: $s[0].title, body: $s[0].body}' > edit.json
            gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body > now.json   # Why (Gitar on #3967): an edit made while settle ran is never overwritten
            if ! jq -e --slurpfile v view.json '.title == $v[0].title and .body == $v[0].body' now.json >/dev/null; then
              { echo; echo "The PR's title or description changed while the pair wrote its numbers: nothing written, the hold stays; start the pair again."; } >> table.md
            else
              if [ -s verdict.txt ]; then { echo; cat verdict.txt; } >> table.md; fi
              if ! jq -e --slurpfile v view.json '.title == $v[0].title and .body == $v[0].body' edit.json >/dev/null; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" --input edit.json >/dev/null
              fi
              if [ "$(jq -r .lift settle.json)" = true ]; then gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label search-hold >/dev/null; fi
              rerun="$(jq -c .rerun settle.json)"
              if [ "$rerun" != '[]' ]; then gh workflow run search-pair.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f pr="$PR" -f people="$rerun" -f tiers="$TIERS" -f attempt=2; fi
            fi
          fi
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          old=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- search-pair -->")) | .id' | tail -1)
          if [ -n "$old" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$old" -F body=@table.md >/dev/null
          else gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file table.md; fi
          # the checks list's text: the Moves lines, or why nothing was counted (140 characters at most)
          if [ "$(jq -r '.rerun | length' settle.json 2>/dev/null || echo 0)" != 0 ]; then text="not counted: $(jq -r '.rerun | join(", ")' settle.json) (a side was starved; the pair runs once more)"
          else text="$(grep '^Moves:' table.md | sed -E -e 's/^Moves: //' -e 's/ \([0-9]+ runs? a side.*//' | paste -sd ';' - | sed 's/;/; /g' || true)"; fi
          echo "status=${text:-no numbers written (the PR changed while the pair ran)}" | cut -c1-150 >> "$GITHUB_OUTPUT"

  status:
    name: "The PR's checks list: the end"
    needs: [setup, pair, comment]
    if: ${{ always() && needs.setup.result == 'success' }}   # a cancelled or failed run must not leave the entry "searching" for good
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - name: "Success with the numbers in its text (never failure: the PR must not turn red)"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ needs.setup.outputs.status_sha }}
          NUMBERS: ${{ needs.comment.outputs.status }}
          ENDED: ${{ needs.pair.result }}
        run: |
          text="$NUMBERS"; [ -n "$text" ] || text="not counted: the pair ended ($ENDED), no numbers"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=success -f context='Search pair' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="${text:0:140}" >/dev/null
