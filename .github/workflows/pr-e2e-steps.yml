name: CI · E2E steps a PR changes
# Job: pick the suites
# The one e2e a pull request runs: the steps it ADDS or EDITS (owner, 2 Nov 2026: "A PR adding a new e2e or modifying the e2e.. should have it as a PR CI check" — "the only exception
# when we run e2e on the PR level"). Every other PR runs no e2e (owner, 1 Nov 2026: "I'd like to avoid e2e at the PR at all / Cause they're very slow"; the journeys run after each merge,
# main-steps.yml). Why it exists: steps that never ran reached main (#2954), and wizard's step in #2963 reached a beta before it ever ran.
# This workflow starts only when the PR changes a file that holds steps (suites/ or lib/); its plan (desktop/e2e/pr-suites.mjs --changed-steps, lib/own-steps.mjs) reads the diff and
# starts e2e.yml on the PR's branch for those steps only, Linux, SQLite or the store they were recorded on. No changed step (a helper, a comment, a line outside a step): it prints
# "no step changed", starts nothing, and ends green in about a minute. The e2e run, titled "E2E for PR · <suites> · <branch>", is read by pr-verdict.yml into "All checks passed":
# the verdict waits for it only when it exists, and a red step turns the status red at once. This job only starts the run and ends; it never waits for the suites (26 Oct 2026).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'desktop/e2e/suites/**'
      - 'desktop/e2e/lib/**'
      - '.github/workflows/pr-e2e-steps.yml'

permissions:
  contents: read
  actions: write   # start e2e.yml on the PR's branch, see it listed (and read the coverage map artifact)
  pull-requests: read   # the PR still open? (no e2e run for a merged one)

concurrency:
  group: pr-e2e-steps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  start:
    name: Start the steps this PR changes
    # A fork has no secrets: nothing to run there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # the plan and the start; nothing waits here for the suites
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: Install what the plan loads
        timeout-minutes: 5
        run: |
          (cd desktop/e2e && npm ci)
          (cd desktop && npm ci --omit=dev --ignore-scripts)
      - name: Plan
        timeout-minutes: 5
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}   # reads the newest code → step map artifact (desktop/e2e/pr-suites.mjs)
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          git fetch -q origin main
          node desktop/e2e/pr-suites.mjs --base origin/main --plan --changed-steps | tee "$RUNNER_TEMP/plan.log"
          grep -q '^suites=.' "$RUNNER_TEMP/plan.log" || echo "No step changed on this PR: no e2e run."
      - name: Start them
        timeout-minutes: 5
        id: start
        if: steps.plan.outputs.suites != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUITES: ${{ steps.plan.outputs.suites }}
          STEPS: ${{ steps.plan.outputs.steps }}   # {suite: [step names], "(stores)", "(why)"} (lib/own-steps.mjs pickChangedSteps)
          HEAD_REF: ${{ github.head_ref }}   # a branch name is untrusted text: never inline in the script
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          # Merged or closed while this job waited for a runner (an override merge deletes the branch: #2041 went red on HTTP 422 "No ref found"): nothing to test.
          if [ "$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state -q .state)" != OPEN ]; then echo "PR #$PR is merged or closed: no e2e run."; echo "skipped=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The input made for this (e2e.yml): SQLite store, no screenshot review, no harness-test step. It runs the PR branch's own e2e.yml.
          # A branch whose workflow file predates the input gets HTTP 422 "Unexpected inputs".
          if ! gh workflow run e2e.yml --ref "$HEAD_REF" -f pr_suites="$SUITES" -f pr_steps="$STEPS" 2>"$RUNNER_TEMP/dispatch.err"; then
            cat "$RUNNER_TEMP/dispatch.err"
            if grep -q 'Unexpected inputs' "$RUNNER_TEMP/dispatch.err"; then echo "This branch's e2e.yml is older than main's: rebase on main (tools/ship.sh does it), then push again."; fi
            exit 1
          fi
          echo "Started e2e.yml on \`$HEAD_REF\`: $SUITES (only the steps this PR adds or changes)."
      # Seen listed before this job ends: pr-verdict.yml runs when this workflow ends, and must find the e2e run pending, never a commit that looks finished.
      - name: See the e2e run listed
        if: steps.plan.outputs.suites != '' && steps.start.outputs.skipped != '1'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 24); do
            id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yml --commit "$HEAD_SHA" -L 20 --json databaseId,displayTitle -q '[.[] | select(.displayTitle | startswith("E2E for PR · "))][0].databaseId // empty')"
            [ -n "$id" ] && { echo "e2e.yml for this PR: https://github.com/$GITHUB_REPOSITORY/actions/runs/$id"; exit 0; }
            sleep 5
          done
          echo "::error::no \"E2E for PR\" run of e2e.yml for $HEAD_SHA after 2 min: this branch's e2e.yml is older than main's (its runs are titled otherwise). Rebase on main (tools/ship.sh does it) and push again."; exit 1
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
