name: E2E
# Job: pick the suites
# The e2e a pull request runs: the steps its changed files reach, on Linux (owner, 10 Nov 2026, asked via AskUserQuestion: "Yes, affected steps only (Recommended)" — "A PR touching
# covered files runs only the e2e steps that cover them, on Linux; e2e stays off for every other PR"), plus the steps it adds or edits (owner, 2 Nov 2026: "A PR adding a new e2e or
# modifying the e2e.. should have it as a PR CI check"). Why: since 2 Nov, 23 of 44 red apply suites on main were Jobs check steps that each product PR passed and the after-merge run
# caught (#3297, #3573, #3630). The plan (desktop/e2e/pr-suites.mjs --plan --changed-steps, lib/pr-affected.mjs) is the after-merge plan of the same diff (main-steps.yml: the coverage
# map, quoted text, data reads), the Linux suites only, at most PR_STEP_CAP steps; the rest is named "after the merge". It starts e2e.yml on the PR's branch for those steps, SQLite.
# No step reached: it prints "no e2e step covers the files this PR changes", starts nothing, and ends green in about a minute. The e2e run, titled "E2E for PR · <suites> · <branch>",
# is read by pr-verdict.yml into "All checks passed": the verdict waits for it only when it exists, and a red step turns the status red at once. This job only starts the run and
# ends; it never waits for the suites (26 Oct 2026). Its paths are main-steps.yml's (tests/tooling/ci/test_workflow_paths.py).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'desktop/renderer/**'
      - 'desktop/lib/**'
      - 'desktop/i18n/**'   # the words a step reads from the catalog (lib/apply-triage-steps.mjs): a renamed word runs the steps that paint it
      - 'desktop/main.js'
      - 'desktop/preload.cjs'
      - 'desktop/ready-fill/**'
      - 'desktop/e2e/suites/**'
      - 'desktop/e2e/lib/**'
      - 'extension/**'
      # The files suites watch (their `export const watches`; #2043 changed quality's score.py and never started this: tests/tooling/ci/test_workflow_paths.py)
      - 'src/**'   # the engine the steps run (the coverage map records src/*.py); src/ai/ and what it imports from its folder (lib/import-graph.mjs watchesWithImports)
      - 'tools/mail_eval.py'
      - 'tests/fixtures/mail_eval.json'
      - 'desktop/e2e/fixtures/golden/**'
      - '.github/workflows/pr-e2e-steps.yml'

permissions:
  contents: read
  actions: write   # start e2e.yml on the PR's branch, see it listed (and read the coverage map artifact)
  pull-requests: read   # the PR still open? (no e2e run for a merged one)

concurrency:
  group: pr-e2e-steps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  start:
    name: steps this PR reaches
    # A fork has no secrets: nothing to run there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # the plan and the start; nothing waits here for the suites
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: Install what the plan loads
        timeout-minutes: 5
        run: |
          (cd desktop/e2e && npm ci)
          (cd desktop && npm ci --omit=dev --ignore-scripts)
      - name: Plan
        timeout-minutes: 5
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}   # reads the newest code → step map artifact (desktop/e2e/pr-suites.mjs)
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          git fetch -q origin main
          node desktop/e2e/pr-suites.mjs --base origin/main --plan --changed-steps | tee "$RUNNER_TEMP/plan.log"
          grep -q '^suites=.' "$RUNNER_TEMP/plan.log" || echo "No e2e step covers the files this PR changes: no e2e run."
      - name: Start them
        timeout-minutes: 5
        id: start
        if: steps.plan.outputs.suites != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUITES: ${{ steps.plan.outputs.suites }}
          STEPS: ${{ steps.plan.outputs.steps }}   # {suite: [step names], "(parts)", "(stores)", "(why)"} (lib/pr-affected.mjs affectedPlan); a suite without names runs whole
          HEAD_REF: ${{ github.head_ref }}   # a branch name is untrusted text: never inline in the script
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          # Merged or closed while this job waited for a runner (an override merge deletes the branch: #2041 went red on HTTP 422 "No ref found"): nothing to test.
          if [ "$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state -q .state)" != OPEN ]; then echo "PR #$PR is merged or closed: no e2e run."; echo "skipped=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The input made for this (e2e.yml): SQLite store, no screenshot review, no harness-test step. It runs the PR branch's own e2e.yml.
          # A branch whose workflow file predates the input gets HTTP 422 "Unexpected inputs".
          # Why (13 Nov 2026, #4008): GitHub answered HTTP 500 "Failed to run workflow dispatch" once and this job went red with no step run; tools/gh_retry.py tries once more
          # after ~10 s on 500/502/503/504. A second refusal stays red, said as such (a 422 "Unexpected inputs" is never retried).
          if ! python3 tools/gh_retry.py workflow run e2e.yml --ref "$HEAD_REF" -f pr_suites="$SUITES" -f pr_steps="$STEPS" 2>"$RUNNER_TEMP/dispatch.err"; then
            cat "$RUNNER_TEMP/dispatch.err"
            if grep -q 'Unexpected inputs' "$RUNNER_TEMP/dispatch.err"; then echo "This branch's e2e.yml is older than main's: rebase on main (tools/ship.sh does it), then push again."
            else echo "::error::GitHub refused to start the steps (tried twice); no step ran. Push again or re-run this job."; fi
            exit 1
          fi
          echo "Started e2e.yml on \`$HEAD_REF\`: $SUITES (the steps this PR reaches; the job summary says why each runs)."
      # Seen listed before this job ends: pr-verdict.yml runs when this workflow ends, and must find the e2e run pending, never a commit that looks finished.
      - name: See the e2e run listed
        if: steps.plan.outputs.suites != '' && steps.start.outputs.skipped != '1'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 24); do
            id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yml --commit "$HEAD_SHA" -L 20 --json databaseId,displayTitle -q '[.[] | select(.displayTitle | startswith("E2E for PR · "))][0].databaseId // empty')"
            [ -n "$id" ] && { echo "e2e.yml for this PR: https://github.com/$GITHUB_REPOSITORY/actions/runs/$id"; exit 0; }
            sleep 5
          done
          echo "::error::no \"E2E for PR\" run of e2e.yml for $HEAD_SHA after 2 min: this branch's e2e.yml is older than main's (its runs are titled otherwise). Rebase on main (tools/ship.sh does it) and push again."; exit 1
      - if: always() && hashFiles('.github/actions/gh-ledger/action.yml') != ''
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
