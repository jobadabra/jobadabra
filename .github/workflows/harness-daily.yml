name: CI · E2E tooling tests · daily
# Every E2E tooling test (desktop/e2e/test/*/*.test.mjs) once a day on main, with the same command a PR runs (harness.yml, `npm test`).
# Why (a8, 30 Oct 2026, option C): a PR runs the whole folder too, but only when it changes what a test reaches; this run catches what no PR starts: runner or package drift,
# data outside harness.yml's paths, a test that depends on the date. One message to the CI alerts chat, only when something fails.
# The second job runs the fixer's real proof container (a live `docker build`), which no PR runs any more; report only, no chat message (it is a measurement of the outside world, see its Why).
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read   # the failed steps' annotations the alert quotes (desktop/e2e/ci-alert.mjs stepCauses; review on #2249)

jobs:
  harness-all:
    name: all E2E tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Install the app's own packages
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      - name: Stage the app's shared files
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      # Why (27 Oct 2026): the headless shell alone cannot load an extension, so every real-extension test here (lib/real-extension.mjs, lib/extension.mjs) failed
      # from the first run on 17 Oct ("Executable doesn't exist ... chrome-linux64/chrome"), 15 of 25 reds. Guard: tests/test_playwright_install_action.py.
      - name: The browsers for the tests' own tests (the full one loads the extension)
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e, mode: both}
      - name: Every E2E tooling test
        working-directory: desktop/e2e
        run: npm test
      - name: One message to the CI alerts chat when a test failed
        # Why (27 Oct 2026, coordinator): a by-hand run on a PR branch alerted the owner (harness-daily run 40457998294). A dispatch on a branch other than main sends no alert; a tag (the gate) and main still do. Guard: tests/test_ci_alert_cancel.py
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || !startsWith(github.ref, 'refs/heads/') || github.ref == 'refs/heads/main') }}
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
        run: node ci-alert.mjs failure "An E2E tooling test no longer passes" "The failing test is in the run, step Every E2E tooling test"

  fixer-sandbox-docker:
    name: fixer sandbox (real Docker image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Why (10 Nov 2026, fx; public #3643 "Integration app (Linux)" timed out in docker build after 3 min, file unchanged since 5 Nov): the proof image is built from a registry pull and apt installs,
      # so a PR must not depend on it; the PR layer checks the sandbox script's arguments against a stub docker (desktop/integration/app/fixer-sandbox.test.js), this job proves the real container nightly.
      - name: The real proof image reaps orphans and resolves its account
        run: node --test --test-timeout=300000 desktop/integration/nightly/fixer-sandbox-docker.test.js
