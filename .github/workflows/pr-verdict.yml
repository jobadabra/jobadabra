name: CI · PR verdict
run-name: ${{ github.event_name == 'workflow_dispatch' && 'PR verdict sweep · on time (Worker cron)' || github.event_name == 'schedule' && 'PR verdict sweep · GitHub schedule (backup)' || 'CI · PR verdict' }}
# Job: report health
# Design: counted runs: the newest per workflow; for E2E for PR runs, per workflow + title.
# tools/pr-verdict.py alone owns verdict(H) = f(H's workflow runs, read fresh).
# A run ending triggers a best-effort update; every ~10 min a sweep repairs pending/missing open heads with no live runs.
# One queue per commit H: the newest writer cancels older writers and reads later; skipped events have unique groups.
# No per-branch queue or timed re-read; pending probes stop at the first truly live run. workflow_run uses main's copy.
# Why (30 Oct 2026, owner, "One writer"): ~21 writers x ~24 calls spent 5,000 REST calls/hour; green PRs stayed pending (#2609/#2605/#2598/#2593).
# Why (28 Oct 2026, owner): "a PR is red only when its diff broke it"; proven main/health failures are grey, score values informational.
# Budget (owner's yes, 26 Oct 2026): CI-changing PR checks get 10 min; "Count running time only" (27 Oct): union job spans exclude queue waits (#2215).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  workflow_run:
    types: [completed]
    workflows:
      # The PR checks by layer (owner, 5 Nov 2026: "Yes, rename + fold"): a name is the layer, so several files share one.
      - 'Guard'
      - 'Unit'
      - 'Integration'
      - 'Smoke'
      - 'E2E'
      - 'Tooling'
      - 'CI · End-to-end on Mac + Linux'
      - 'CI · Control tests (measure, not required)'
      - 'CI · Hosted Always on cost probe (one-off)'
      - 'Proof · Codex subscription broker'
      - 'Extension · Chrome Web Store publish'
      - 'Proof · LibreOffice add-on on Mac and Windows'
      - 'CI · Ready to send image'
      # Why (5 Nov 2026, a8): a PR opened before the rename runs these old names until it merges main. TODO(AI): drop these 10 lines once no open PR runs them (12 Nov 2026).
      - 'CI · Pull request'
      - 'CI · E2E steps a PR changes'
      - 'CI · E2E tooling tests'
      - 'CI · Integration tests'
      - 'CI · Smoke (the app starts)'
      - 'CI · Integration · Page cases (all cases, real extension, Linux)'
      - 'CI · Tests · desktop (Windows)'
      - 'CI · Tests · desktop'
      - 'CI · Tests · python'
      - 'CI · Tests · worker'

permissions:
  contents: read

jobs:
  sweep:
    name: Find pending open PR heads
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read          # planner drops live or empty counted heads before taking their queue
    concurrency:
      # Why (30 Oct 2026, review): concurrency precedes if; skipped event planners must never queue with or replace a real sweep.
      group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'pr-verdict-sweep' || github.run_id }}
      cancel-in-progress: false
    outputs:
      heads: ${{ steps.heads.outputs.heads }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          sparse-checkout: |
            tools/pr-verdict.py
            tools/pr_verdict_sweep.py
            tools/gh-ledger.sh
            .github/actions/gh-ledger
            tools/github_limit.py
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - id: heads
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pr-verdict.py --repo "$GITHUB_REPOSITORY" --sweep-heads
      - if: always() && hashFiles('.github/actions/gh-ledger/action.yml') != ''
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  verdict:
    name: Write the PR's verdict
    needs: sweep
    # Why (27 Oct 2026, 6e with the owner's yes): replaced commits started verdicts after every workflow, holding runners; 22 were cancelled
    # at 06:53 while 38 Linux jobs queued under GitHub's 20-job cap. pull_requests[].head.sha is the head NOW and empty after merge/close.
    # A skipped event takes no runner; pr_meta revalidates open sweep heads before writing.
    if: >-
      always() && (
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_sha == github.event.workflow_run.pull_requests[0].head.sha)
      || startsWith(github.event.workflow_run.display_title, 'E2E for PR · ')
      || (needs.sweep.result == 'success' && needs.sweep.outputs.heads != '[]'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sha: ${{ fromJSON(needs.sweep.outputs.heads || format('["{0}"]', github.event.workflow_run.head_sha)) }}
    # Why (30 Oct 2026, owner: "PR verdicts still don't work properly"): branch queues drop completions; newest per-head writer reads later.
    # Concurrency applies before if: skipped events use run_id, never a handled head's group. Sweeps share the head's group.
    concurrency:
      group: >-
        pr-verdict-${{ ((github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_sha == github.event.workflow_run.pull_requests[0].head.sha)
        || startsWith(github.event.workflow_run.display_title, 'E2E for PR · ')) && github.event.workflow_run.head_sha
        || (github.event_name != 'workflow_run' && matrix.sha) || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 5
    permissions:
      actions: write         # the commit's workflow runs (read) and the search pair's start (write: tools/pr_verdict_pair.py, workflow_dispatch of search-pair.yml; owner via sa, 14 Nov 2026)
      checks: write          # failed steps' annotations (read: desktop/e2e/ci-alert.mjs stepCauses, tools/pr_flaky.py) and one display row per by-hand run on the PR's current head (write: tools/pr_verdict_rows.py; never a required check)
      pull-requests: read    # the PR's files and commits (the CI change budget)
      statuses: write        # the "All checks passed" status
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          # Its companions too: each one a standalone copy fetched over the API cost a call per write (main_state_module).
          sparse-checkout: |
            tools/pr-verdict.py
            tools/pr_verdict_sweep.py
            tools/pr_verdict_runs.py
            tools/pr_verdict_rows.py
            tools/pr_verdict_pair.py
            tools/pr-body-check.py
            tools/persona-search/pair.py
            tools/persona-search/pair_row.py
            tools/persona-search/engine_calls.py
            tools/pr_verdict_greys.py
            tools/main_e2e_state.py
            tools/pr_ai_number.py
            tools/pr_health_greys.py
            tools/pr_speed_number.py
            tools/beta_rate_gate.py
            tools/pr_flaky.py
            tools/flaky-verdict.mjs
            tools/pr_verdict_pair_gate.py
            desktop/e2e/
            tools/gh-ledger.sh
            .github/actions/gh-ledger
            tools/github_limit.py
            tools/gh_retry.py
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - name: All checks passed?
        id: verdict
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ matrix.sha }}
          REVALIDATE_HEAD: ${{ github.event_name != 'workflow_run' && '--revalidate-head' || '' }}
        run: python3 tools/pr-verdict.py --repo "$GITHUB_REPOSITORY" --sha "$SHA" $REVALIDATE_HEAD
      - if: always() && hashFiles('.github/actions/gh-ledger/action.yml') != ''
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
