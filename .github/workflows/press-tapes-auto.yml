name: Press tapes auto
run-name: Press tapes auto · the day's re-record
# The day's re-record of the Find jobs recordings. Until 12 Nov 2026 it started after each merge (owner, 11 Nov 2026, asked via AskUserQuestion by sa: "Auto re-record after merge (Recommended)": "A workflow starts by itself after each merge that touches the search, re-records only the people
# whose recording has a gap (the check already lists them), on the scheduled AI lane, one run pending at a time"; why: on #3802, #3803, #3826 and #3832 the yardstick read "Verdict covers 0 or 1 of 18 people" until someone re-recorded by hand).
# 1. gaps: press-yardstick.yml mode=gaps, one offline replay of main on the recordings (no AI): the people whose replay asks for what their recording lacks, plus people with no recording (ci.recording_gaps, the PR comment's "Re-record").
# 2. guard: waits (up to 5 h, a free runner, no AI call) while a Search check, a by-hand tape run or the night Search check's hour holds the broker, stands down (green) when a newer automatic run is pending, ends RED if the broker is still held; reads how many people may record at once (3 when nothing else is on the broker, else 2; owner, 11 Nov 2026).
# 3. record: press-tapes.yml's own job, lane scheduled (never the by-hand lane's 800 calls a day), 180 s presses, a per-person room check that stops it when the scheduled lane has no room (never another AI), a tape with a refused or Free AI call is not published.
# 4. summary: what was recorded, the broker's calls by press tapes today and yesterday, and a by-hand run that started during the recording named as the likely cause of a tape that was not published.
# 5. band + table (owner, 12 Nov 2026, asked via AskUserQuestion by sa: "Off PRs, nightly on main": "I feel Like I'm not getting any value of this. It never failed. It's just slow."): the Find jobs replay no longer runs on a PR.
#    Once the recordings are renewed it waits for the band that press-tapes.yml dispatches on them, then press-yardstick.yml mode=pr measures main against that band on all 18 people (the one moment every person is measured) and
#    writes the table in its job summary of this run; the PR's proof is the live same-minute pair plus the Search night.
# A day's merges end in ONE re-record of the newest main: this workflow's group keeps one running and one pending run, the pending one recomputes the gaps on the newest main when it starts. It never uses the `search-personas` group (a
# pending run there would replace a queued by-hand run).
# Trigger = the site Worker's timer (app-core/src/scheduler.js), or by hand; never each merge. Two kinds of start (owner, 13 Nov 2026, asked via AskUserQuestion by mac-9a: "When the replay finds many empty": "The daily replay re-records by itself when it sees
# several people with 0 jobs, then re-runs. It only spends a run when the recordings are stale."; rejected: "By hand after merge batches", "Add a second daily slot"):
#    the day's run, 10:30 UTC (TAPES_SLOT; after the night's passes and Thursday's Search week), no input: the catch-all, it records any gap and its table always runs;
#    the hourly look (TAPES_CHECK), input min_gaps = the line: the gap check is offline and free, `decide` records only when at least that many of the 18 people have a gap, else the run ends there with one summary line (no recording, no AI call, no table).
#    After a recording the band and the table replay main again, as always.
# Why (12 Nov 2026, owner, asked via AskUserQuestion by sa: "Report only, live decides (Recommended)": "recordings are renewed once after a day's merges instead of after each merge, which saves Codex-plan calls"):
# about 11 search merges that day aged the recordings faster than 8 re-records renewed them (the replay measured 3 of 18 people), and the replay no longer decides a PR (tools/press-yardstick/verdict.py).
on:
  workflow_dispatch:
    inputs:
      min_gaps:
        description: 'The hourly look (the Worker): record only when at least this many people have a gap. Empty = 1: the daily run, which records any gap and always replays the table'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: press-tapes-auto
  cancel-in-progress: false

jobs:
  gaps:
    name: Who needs a new recording (main's replay, offline)
    uses: ./.github/workflows/press-yardstick.yml
    with: {mode: gaps}
    secrets: inherit
    permissions:
      contents: read
      actions: read

  decide:
    name: Are the recordings stale enough to record now (tools/press-yardstick/rerecord_decision.py)
    needs: gaps
    if: ${{ needs.gaps.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      record: ${{ steps.line.outputs.record }}
      daily: ${{ steps.line.outputs.daily }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/press-yardstick
      - id: line
        env:
          PERSONAS: ${{ needs.gaps.outputs.personas }}
          MIN_GAPS: ${{ inputs.min_gaps }}
        run: python3 -I tools/press-yardstick/rerecord_decision.py

  guard:
    name: No by-hand run holds the broker, and how many may record at once
    needs: [gaps, decide]
    if: ${{ needs.decide.outputs.record == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.hold.outputs.go }}
      parallel: ${{ steps.hold.outputs.parallel }}
    steps:
      - id: hold
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          # Why (11 Nov 2026, sa: "never record while a Search check uses the broker (its refusals would be recorded)"): a queued or running Search check or by-hand tape run holds the broker; this run waits for it.
          # Why (12 Nov 2026, run 43112178073 after #3840): it waited 22 min on a running all-18 Search check, stood down, recorded nobody and ended GREEN, so the gap stayed. Now it waits up to 5 h (a free runner, no AI call; one look every 2 min keeps the token's request budget), an older run stands down when a newer one is pending (that one replays and records on newer code, #3841 landed mid-run), and a run that ends still held ends RED.
          # Holds the broker: a Search check (search-personas.yml: the night run, the week, a by-hand run) or a by-hand tape run (press-tapes.yml) that is queued, waiting or running; and the hour before the night run's slot 00:00 UTC
          # (app-core/src/scheduler.js SEARCH_SLOT) until 10 min after it, when the Worker starts it: a recording that began just before would run beside it and take its refusals (the nightly is then listed above and waited for).
          held() { for workflow in search-personas.yml press-tapes.yml; do for state in in_progress queued waiting; do gh run list --repo "$REPO" --workflow "$workflow" --status "$state" --json url --jq '.[].url' || true; done; done; }
          due() { m=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) )); [ "$m" -ge 1380 ] || [ "$m" -lt 10 ]; }
          blocked() { held; if due; then echo "the night Search check is due at 00:00 UTC"; fi; }
          mine=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          newer() { for state in pending queued waiting; do gh run list --repo "$REPO" --workflow press-tapes-auto.yml --status "$state" --json createdAt,url --jq ".[] | select(.createdAt > \"$mine\") | .url" || true; done; }
          for _ in $(seq 1 150); do
            n=$(newer)
            if [ -n "$n" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "### Stood down: a newer automatic run is pending" >> "$GITHUB_STEP_SUMMARY"
              echo "It replays main's newest code and records the people it names, so this run records nobody: $n" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            now=$(blocked); [ -z "$now" ] && break
            echo "waiting, a Search check or a by-hand tape run holds the broker: $now"; sleep 120
          done
          now=$(blocked)
          if [ -n "$now" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "### Not recorded: a Search check, a by-hand tape run or the night run's hour still holds the broker after 5 h" >> "$GITHUB_STEP_SUMMARY"
            echo "No recording started, so no refusal can spoil a tape; the people stay gaps. Dispatch press-tapes-auto.yml when it ends: $now" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The broker was held for 5 h, nobody was re-recorded (see the summary)"
            exit 1
          fi
          # Three at once only while nothing else is on the broker (its /health `queue`: calls in flight + waiting); a count it does not say is not idle (owner, 11 Nov 2026: "3 at once, broker free").
          busy=$(curl -fsS --max-time 20 https://jobadabra-ai-broker.jobpilotto.workers.dev/health | node -e 'const q = JSON.parse(require("fs").readFileSync(0, "utf8")).queue; console.log(q && Number.isInteger(q.active) ? q.active + Object.values(q.waiting || {}).reduce((a, b) => a + b, 0) : 99)' || echo 99)
          parallel=2; [ "$busy" -le 1 ] && parallel=3
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "parallel=$parallel" >> "$GITHUB_OUTPUT"
          echo "Broker calls in flight or waiting: $busy, so $parallel people at once"

  record:
    name: Re-record the people with a gap
    needs: [gaps, guard]
    if: ${{ needs.guard.outputs.go == 'true' }}
    uses: ./.github/workflows/press-tapes.yml
    with:
      personas: ${{ needs.gaps.outputs.personas }}
      lane: scheduled
      ceiling: '180'
      parallel: ${{ needs.guard.outputs.parallel }}
      auto: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write   # the Codex broker: GitHub OIDC, no stored secret
      actions: write    # press-tapes.yml's band job dispatches press-yardstick.yml mode=band

  band:
    name: The band on the renewed recordings (press-tapes.yml dispatched it)
    needs: [gaps, record]
    if: ${{ !cancelled() && needs.gaps.result == 'success' && needs.record.result != 'skipped' }}   # Why (12 Nov 2026, Gitar on #3939): press-tapes.yml's own band job runs on `record.result != 'skipped'`, so one unpublished tape (record red) still dispatches a band on the tapes that were published; the table waits for it too, never reads the old band
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Why (12 Nov 2026, owner: "Off PRs, nightly on main"): the table compares main with a band built on the recordings it replays; a table started beside the band would read "no band on this recording" for every renewed person.
          # press-tapes.yml's band job (it ran inside `record`) dispatched the band on main: find it by its title and wait for it.
          # Why (12 Nov 2026, Gitar on #3939): the band run is the first one dispatched after press-tapes.yml's band job started inside `record`, so a by-hand mode=band started during the hours-long guard and record window is not taken for it.
          start=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '[.jobs[] | select(.name | test("Rebuild main.s yardstick band")) | .started_at][0] // empty')
          [ -n "$start" ] || start=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          id=""
          for _ in $(seq 1 20); do
            id=$(gh run list --repo "$REPO" --workflow press-yardstick.yml --event workflow_dispatch --created ">=$start" --json databaseId,displayTitle,createdAt --jq '[.[] | select(.displayTitle == "Find jobs pipeline yardstick band")] | sort_by(.createdAt) | .[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 30
          done
          [ -n "$id" ] || { echo "::error::press-tapes.yml dispatched no band run in 10 min, so the table would read the old band"; exit 1; }
          echo "Waiting for the band run $id: https://github.com/$REPO/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" --repo "$REPO" --interval 30 --exit-status > /dev/null

  table:
    name: The 18-person table (main's replay on the renewed recordings, offline)
    needs: [gaps, decide, guard, record, band]
    # Why (13 Nov 2026, owner: "then re-runs. It only spends a run when the recordings are stale"): the hourly look that records nobody ends without a table (24 replays a day otherwise); the day's run (daily) and any run that recorded replay main again.
    if: ${{ !cancelled() && needs.gaps.result == 'success' && needs.decide.result == 'success' && (needs.decide.outputs.daily == 'true' || needs.record.result != 'skipped') && (needs.band.result == 'success' || needs.band.result == 'skipped') }}
    uses: ./.github/workflows/press-yardstick.yml
    with: {mode: pr}
    secrets: inherit
    permissions:
      contents: read
      actions: read

  summary:
    name: What the automatic re-record did
    needs: [gaps, decide, guard, record, band, table]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GAPS: ${{ needs.gaps.outputs.personas }}
          GAPS_RESULT: ${{ needs.gaps.result }}
          RECORD_RESULT: ${{ needs.record.result }}
          TABLE_RESULT: ${{ needs.table.result }}
        run: |
          {
            echo "### Automatic re-record"
            echo "- Gap check (main's replay, offline): ${GAPS_RESULT}; people to re-record: ${GAPS:-none named}"
            echo "- Recording: ${RECORD_RESULT}"
            echo "- The 18-person table (main's replay on the renewed recordings): ${TABLE_RESULT}, in this run's \"Find jobs replay\" job summary"
            # The budget line (sa, 11 Nov 2026): the broker's own per-workflow tally by UTC day, no new store; the lane stops each person under its own line (recording_room.py), never under a threshold of this file.
            curl -fsS --max-time 20 https://jobadabra-ai-broker.jobpilotto.workers.dev/health | node -e '
              const days = (JSON.parse(require("fs").readFileSync(0, "utf8")).tally || {}).days || {}, names = ["jobadabra/press-tapes.yml", "jobadabra/press-tapes-auto.yml"];
              const day = back => new Date(Date.now() - back * 86400000).toISOString().slice(0, 10), calls = back => names.reduce((sum, name) => sum + ((days[day(back)] || {})[name]?.calls || 0), 0);
              console.log(`- Broker calls by press tapes (by hand and automatic together): ${calls(0)} today (UTC), ${calls(1)} yesterday`);' || echo "- Broker calls by press tapes: the broker did not say"
            if [ "$RECORD_RESULT" != success ] && [ "$RECORD_RESULT" != skipped ]; then
              start=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
              spoilers=$(for workflow in search-personas.yml press-tapes.yml; do gh run list --repo "$REPO" --workflow "$workflow" --created ">=$start" --json url --jq '.[].url' || true; done)
              if [ -n "$spoilers" ]; then
                echo "- A by-hand run started while this one recorded, so a tape that was not published is probably spoilt by its refused calls, not a broken recording; it is recorded again by the next run: $spoilers"
              else
                echo "- A tape that was not published had refused or other-AI calls, or the scheduled lane had no room (see the Tape legs); those people stay gaps for the next run."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
