name: CI · Search check (6 personas)
# Once a night, alone on the broker: six fictional job seekers press Find jobs once on fresh installs, one after the other; a press over 180 s reads red. A report: it blocks nothing.
# Why (4 Nov 2026, owner: "still doesn't work. We tried to fix it 10+ times", chose "Night run, off PRs"; reverses 27 Oct's check on every search PR, #2285): none of the last 15 PR results found a job (8 not measured,
# 5 found 0, 2 red) because the result follows the broker's load, so it could not judge a PR. A search PR relies on its unit and integration tests. The coordinator reads each night; two not measured or a drop goes to the owner.
# Quality is shown per persona and pooled; it reads red only after 10 measured complete runs on main, below their mean minus twice the sample standard deviation
# (owner, 27 Oct 2026: "Time only, until 10 runs"). Each night contributes another measured run.
# Why (30 Oct 2026, owner; supersedes 27 Oct's proof-key decision): PR workflows cannot reach an AI key; CI AI uses the Codex subscription.
# The app and engine keep their Messages contract; codex.mjs sends every call to the existing OIDC broker, including the blind judge. No secret or API fallback.
# Tools: tools/persona-search/gate.py (cv, result, compare), gate_judge.py (the blind judge), run.mjs (the press). Guard: tests/test_search_personas_gate.py.
# The Worker starts it once a night (app-core/src/scheduler.js SEARCH_SLOT); a person can start it any time.
run-name: ${{ inputs.scheduled && 'Search check · nightly (Worker cron)' || 'Search check · by hand' }}

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'The Worker started it (the name says so); leave off by hand'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read         # the measured history of earlier runs on main

concurrency:   # one at a time, so a by-hand run never shares the broker with the night's; it waits, never cancels
  group: search-personas
  cancel-in-progress: false

env:
  CI_AI_PROVIDER: codex
  E2E_AI_PROVIDER: codex
  JOBADABRA_MODEL_OVERRIDE: claude-haiku-5-5   # Why (30 Oct 2026, owner; names renamed 1 Nov 2026): retain the small tier through the Codex broker; tests/test_search_personas_gate.py

jobs:
  persona:
    name: Persona ${{ matrix.persona }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write   # Existing broker authentication: GitHub OIDC, no stored secret.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        persona: [1, 2, 3, 4, 5, 6]   # Why (4 Nov 2026, owner's "Night run, off PRs"; 30 Oct kept all six cases): one at a time, so a slow call is the AI's and never another press's queue
    steps:
      - name: This run can use the Codex broker
        id: token
        run: |
          mkdir -p out
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::warning::No trusted GitHub OIDC token: the search check is not measured"
          printf '{"persona": %s, "not_measured": "no trusted GitHub OIDC token for Codex"}\n' "${{ matrix.persona }}" > out/result.json
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'yes'
        with: {persist-credentials: false}
      - uses: ./.github/actions/gh-ledger
        if: steps.token.outputs.ok == 'yes'   # the checkout that holds the action only runs for a trusted run
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'yes'
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        if: steps.token.outputs.ok == 'yes'
        with: {python-version: '3.12'}
      - name: The engine, the app's libraries and a browser
        if: steps.token.outputs.ok == 'yes'
        run: |
          pip install --quiet -r requirements.txt
          (cd desktop && npm ci && node scripts/stage.mjs --files-only)   # Why (#2259): the API engine imports desktop/shared/app-core/ai.js, which stage.mjs generates; the plan engine never loaded it
          (cd desktop/e2e && (npm ci || npm install))
      # Why (runs 40510577328, 40507593762, 27 Oct 2026): a bare --with-deps install crawled at 41 kB/s for 10 min and the persona hit its 12-min cap.
      - name: The browser (cached; a stalled mirror is cut and retried)
        if: steps.token.outputs.ok == 'yes'
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e, mode: both}
      - name: The persona's fictional CV, then one Find jobs press (small tier through the Codex relay)
        if: steps.token.outputs.ok == 'yes'
        run: |
          set -o pipefail
          python3 tools/persona-search/gate.py cv "${{ matrix.persona }}" out
          node tools/persona-search/codex.mjs -- node tools/persona-search/run.mjs draw "$GITHUB_WORKSPACE/out" --presses 1 --fresh --engine api --tag gate 2>&1 | tee out/run.log || true
          grep -h 'with claude-' out/draw/run-*.log | grep -v -c 'claude-haiku-5-5' > out/non-haiku-steps.txt || true
          python3 tools/persona-search/gate.py extract "$(node -p 'require("os").tmpdir()')/jp-persona-draw-gate/data/jobs.sqlite" out/jobs.json
      - name: The blind judge (right role, right place; Codex small tier)
        if: steps.token.outputs.ok == 'yes'
        run: |
          set -o pipefail
          node tools/persona-search/codex.mjs -- python3 tools/persona-search/gate_judge.py "${{ matrix.persona }}" out/jobs.json out/judged.json 2>&1 | tee out/judge.log
      - name: The persona's numbers
        if: always() && steps.token.outputs.ok == 'yes'
        run: python3 tools/persona-search/gate.py result "${{ matrix.persona }}" out
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: search-personas-p${{ matrix.persona }}
          retention-days: 30
          path: |
            out/result.json
            out/judged.json
            out/run.log
            out/judge.log
            out/draw/presses.jsonl
            out/draw/run-*.log
      - if: always() && steps.token.outputs.ok == 'yes'
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  compare:
    name: Search check
    needs: persona
    if: ${{ !cancelled() }}   # Why (#2243, 3 Nov 2026 7/7): a cancelled run posted a red table ("p6: no result"), so compare only when the personas were not cancelled
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/download-artifact@v7
        with: {pattern: 'search-personas-p*', path: results}
      - name: Earlier measured runs on main (the quality gate, from 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p main
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow search-personas.yml --branch main --status completed --limit 40 \
                        --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            # Why (#2295, gitar): fetch more than the ten measured runs the gate requires; neutral or incomplete runs must not consume all history slots.
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n search-personas-result -D "main/$id" 2>/dev/null || continue
          done
          printf 'main runs: '
          for dir in main/*; do [ ! -d "$dir" ] || printf '%s ' "${dir#main/}"; done
          printf '\n'
      - name: Compare with the earlier runs
        id: compare
        run: |
          set +e
          mapfile -t mains < <(find main -mindepth 1 -maxdepth 1 -type d | sort -t/ -k2 -nr)   # newest run first
          python3 tools/persona-search/gate.py compare results result "${mains[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: search-personas-result, path: result/verdict.json, retention-days: 90}
      - name: The table in the run's summary
        if: always()
        run: cat result/table.md >> "$GITHUB_STEP_SUMMARY"
      - name: Red when a persona is below the earlier runs' range or a press is over 3 minutes
        env:
          CODE: ${{ steps.compare.outputs.code }}
        run: test "$CODE" = 0
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
