name: Guard
# The pure checks a change must pass before it merges (owner, 12 Oct 2026: landing through pull requests, tools/ship.sh). The suites are CI · Tests (build.yml) and the
# recorded-page replays (page-cases.yml), which start by `on: paths:`.
# ONE required status on main, "All checks passed" (owner, 15 Oct 2026: four required jobs took four runner slots per PR and GitHub's queue was the wait). Since 26 Oct 2026
# pr-verdict.yml writes it, in seconds, each time a PR workflow ends (tools/pr-verdict.py); this job is one of the workflows it reads. This job used to BE the required
# check and wait up to 60 min for the others on a runner ("Other workflows passed"): with pr-suites.yml's wait, two runners per PR push only waited (owner: "How could you
# design such a slow and inefficient method of checking PRs?"). The job always starts; a step that does not apply ends in seconds; a red step does not hide the next ones (`!cancelled()`).
# `edited` (owner, 17 Oct 2026): a PR retargeted to main (its base edited from another branch) runs the gate, so no rebase is needed to get the required check. It runs the same
# job, never a skipped one: a skipped required job would count as green and hide an earlier red.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Why (10 Nov 2026, fr; #3643 and 78 other PRs since 25 Oct: a cancelled "pure checks" stays red on the head beside its green twin, 73 of the 75 read said "higher priority waiting request for pr-gate-N-text"):
# two runs on ONE commit must never share a group, because the group keeps one waiting run and cancels the rest, and GitHub's rollup counts a cancelled run as red for as long as the commit stays.
# A push or an open is the only event that replaces an older run (the older run is on a head that is gone, so its cancelled check is on no live head). A title/description edit or a reopen
# (same commit) gets a group of its own, its run id, so it neither cancels nor is cancelled; two edits seconds apart both run, each on the text it was started with.
# Same rule as the site's tests.yml since 6 Nov (jobadabra-web #462: 15 of 53 PRs had a cancelled twin before, 0 of 47 after). History: 17 Oct 2026, #1162 split 'text' from 'code' so an edit never cancelled a push's run; that left two edits in ONE group.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}-${{ (github.event.action == 'edited' || github.event.action == 'reopened') && format('same-commit-{0}', github.run_id) || 'code' }}
  cancel-in-progress: true

jobs:
  required:
    name: pure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # the replay of a recorded case a PR brings is the long part (#501: 503 s)
    permissions:
      contents: read
      pull-requests: read   # the open PRs on the same flow files (tools/flow-fresh.mjs)
      actions: read         # the commit's runs and jobs, for the PR's verdict
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The same script the local push runs (tools/pre-push-check.sh, its fast pure checks): commit subjects, a fix names its test, file size, recorded cases (holes 1+2),
      # the rung trailer, e2e issue links, stale expectations. CI_GATES=1: no red-main look, no AI place check.
      - name: Fast checks
        run: |
          git fetch -q origin main
          jq -n --arg cwd "$PWD" '{tool_input: {command: "CI_GATES=1 git push origin pr"}, cwd: $cwd}' | bash tools/pre-push-check.sh
      # The description keeps the layout tools/pr-body-format.py gives it (owner, 16 Oct 2026: "didn't add separators, didn't use headings"): a "## " verdict, "---"
      # separators, "### " headings. A step here, not its own workflow (owner, 17 Oct 2026: its two check lines per PR were noise); an edit re-runs this job (`edited`).
      - name: PR description laid out
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
          # Why (4 Nov 2026, #3095): '' is falsy in a GitHub expression, so "&& '' ||" always gave the title and a bot's PR went red on the session tag. The PR's author, not the actor: a person may edit a bot's PR.
          PR_TITLE: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.title || '' }}   # the "[xx] " session tag (a bot's PR has none)
        # Why (10 Nov 2026, owner, finish line G4): --base lets the check read which files the PR changes, for the Find jobs admission line ("Moves:").
        run: |
          git fetch -q origin main
          printf '%s' "$BODY" | python3 tools/pr-body-check.py --base origin/main
      # Why (7 Nov 2026, owner: "we overwrite one another and we never get it right"): a PR that changes or removes a past fix of the press's ledger
      # (tests/unit/press/ledger.py) carries the owner's words for it, `Ledger-change: L<nn> "<words>"`; adding a fix needs nothing.
      - name: Fix ledger kept
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch -q origin main
          printf '%s' "$BODY" | python3 tools/press-ledger-check.py --base origin/main
      # Why (10 Nov 2026, owner: "Fixed guardrails"; finish-line spec G3): what the night Search check measures with (the 18 people, the judge's prompt, the fixed
      # source list, the check's one AI) changes only with `Scoreboard-change: "<owner's words>"` and a rewritten tools/persona-search/scoreboard.lock.json.
      - name: Scoreboard kept
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | python3 tools/persona-search/scoreboard.py --check --base origin/main
      - name: Floors lowered only with the owner's words
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | python3 tools/persona-search/floors.py --check-reset --base origin/main
      # The open PR is the claim on the applying flow's files (tools/flow-fresh.mjs): red when main changed, since this PR's base, a flow file it also changes.
      # tools/ship.sh rebases and pushes again by itself on this failure (it finds this step's name: keep it in tools/ship-pr.sh).
      - name: Core flow files up to date with main
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          node tools/flow-fresh.mjs --base origin/main --head "${{ github.event.pull_request.head.sha }}" --others
      # Every recorded case this PR adds or changes must FAIL on the PR's base (and pass on its head: the replay shards). Decide first, from git alone (seconds): a PR that
      # brings no case installs and replays nothing (12 Oct 2026: #501's label-only edit to 74 cases took 503 s). A case.json edit to label keys only is no case
      # (tools/recorded-cases.mjs LABEL_KEYS); a "Recorded-pins" case is not replayed; a refused pin fails here at once.
      - name: Which recorded cases this PR brings
        id: which
        if: ${{ !cancelled() }}
        run: |
          git fetch -q origin main
          git checkout -q "${{ github.event.pull_request.head.sha }}"   # the PR head, not the merge commit (the fast checks above read the merge)
          cases="$(node tools/recorded-fails-on-old.mjs --base origin/main --list)"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          if [ -z "$cases" ]; then echo "this PR brings no recorded case: nothing to replay"; else echo "to replay on the old code: $cases"; fi
      - name: A browser for the replay
        if: ${{ !cancelled() && steps.which.outputs.cases != '' }}
        run: |
          (cd desktop/e2e && npm ci)
          (cd desktop && npm ci --omit=dev --ignore-scripts)
      - name: Chromium for the replay (the full browser, it loads the real extension)
        if: ${{ !cancelled() && steps.which.outputs.cases != '' }}
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e}
      # Why (13 Nov 2026, owner, asked via AskUserQuestion: "Add the check (Recommended)"; 2 escapes in 30 days): #3684 (10 Nov) and #3939 (12 Nov) changed press-yardstick.yml, merged green here,
      # and turned web's search-night-prs test red on every web PR. A file a web test reads (tools/web-tests-reached.mjs derives it from the tests' own text) now runs just those tests of
      # jobadabra-web main in the joined tree, here, before the merge. Nothing read = about a second. A test already red on the base is a warning, not this PR's red.
      # No secret in this job: it is never skipped (a skipped required job counts green), and a job with a secret must skip a bot's fd-ai/ branch (tests/tooling/ci/test_workflow_ai_secret_jobs.py).
      # Web is public today; when it goes private the clone is refused and the step ends with "web tests NOT run: ... (private?)" (coordinator, 13 Nov 2026: a token path is parked on the Work board).
      - name: Web tests that read this PR's files
        if: ${{ !cancelled() }}
        run: |
          git fetch -q origin main
          bash tools/web-tests-reached.sh origin/main "${{ github.event.pull_request.head.sha }}"
      - name: New test pages fail on the old build
        if: ${{ !cancelled() }}
        env:
          JOBADABRA_HEAVY: '0'   # the Mac's one-at-a-time lock means nothing on a runner of its own
        run: |
          [ -n "${{ steps.which.outputs.cases }}" ] || { echo "no recorded case in this PR: nothing to replay"; exit 0; }
          node tools/recorded-fails-on-old.mjs --base origin/main
