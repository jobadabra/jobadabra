name: CI · Ops overview
# Where our engineering time goes (owner, 15 Oct 2026): the merged PRs of the last 30 days, by what they change, for https://www.jobpilotto.top/admin/agents/overview.
# Hourly (this cron) or by hand; each PR is read once (tools/ci-intel/jobs/ops-overview.mjs); the site keeps one row per PR and one snapshot row, so a merged PR shows within the hour.
# Why a workflow and not the page reading GitHub: a page load would spend GitHub calls and D1 reads each time; here one write per PR, one row read per page.
# Why here (2 Nov 2026, owner): it reads this repo's own PRs and runs; it was jobadabra-web's ops-overview.yml, which laid this repo's tree under that one every hour.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ops-overview-${{ github.sha }}   # the sha keeps a run per commit of main apart (tests/test_workflow_contract.py); a repeat is harmless: a PR is stored once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          sparse-checkout: tools/ci-intel
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: Read the new merged PRs and publish them
        timeout-minutes: 10
        run: node tools/ci-intel/jobs/ops-overview.mjs
