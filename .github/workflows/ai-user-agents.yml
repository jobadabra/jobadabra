name: CI · AI user agent

# THE DAILY SESSION OF THE AI USER AGENT (owner, 3 Nov 2026: "a claude agent that literally tests my app by clicking around. And can interpret on the fly things"; "start it now, use the ai-broker").
# The Worker starts it once a day (app-core/src/scheduler.js AGENT_SLOT, 04:40 UTC); a person can start it any time. One person-like session on the real app, through the AI broker (Codex, then Claude, then Free AI), sized from who answers
# (desktop/e2e/agent-nightly.mjs): Codex out = half a session, a broker that refuses = no session and the reason in the summary. It files what it can argue is a bug (ui-findings.yml reads this run like an e2e run, detector "AI user agent"),
# keeps its notes on the `agent-memory` branch, and writes the cost line in the job summary. It is a measurement: it gates nothing, and a pause is the repository variable AI_USER_AGENT = off.
# Why (3 Nov 2026, AI user agents 7/12, 8/12): its own workflow, not an e2e.yml suite, so Actions and the broker's per-workflow tally show it as one line of its own; the run-name tells a nightly, a replay, a lane (7 Nov 2026, pz: "AI user agent · lane n") and a hand run apart.
run-name: ${{ inputs.scheduled && 'AI user agent · nightly (Worker cron)' || (inputs.lane != '' && format('AI user agent · lane {0}', inputs.lane) || inputs.plan != '' && format('AI user agent · replay {0}', inputs.plan) || 'AI user agent · by hand') }}

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Started by the Worker on time (the run is named so; the watchdog looks for it)'
        type: boolean
        default: false
      seed:
        description: 'The night seed (empty = today as a number): the same seed plans the same goals and person'
        required: false
      # The replay proof (spec "Proof", 8/12): a run with any of these three measures and files nothing (no issue, no memory); its artifact is named agent-replay-<run>.
      app_ref:
        description: 'Replay: the commit whose APP is tested (a 7-40 character SHA, e.g. the commit before a fix); the tests and the agent come from this workflow''s commit. Empty = this commit'
        required: false
      plan:
        description: 'Replay: a named plan (learned-questions, saved-answers, languages, inbound, board, app-language, tour) instead of the seeded goals'
        required: false
      rules_off:
        description: 'Replay: rule ids taken out of what the agent knows, comma separated (profile-1,jobs-3): the unprompted run'
        required: false
      shape:
        description: 'The known-bug data shape put in the app before the free goals: headings, languages, inbound, none, or empty = the one the seed picks'
        required: false
      tier:
        description: 'The model tier that acts: small, mid or large (the Opus map); another word fails the run. Empty = mid for a night (large stalls, 5 Nov 2026), small for a replay. Every run stops cleanly at about 250k tokens in total'
        required: false
      screen:
        description: 'off = no screen reader after each goal (empty = on)'
        required: false
      engine:
        description: 'claude = the acting calls go to Claude alone, not Codex first (empty = the broker order). A dispatch is a replay (no memory, small tier unless tier=large is also set); the repository variable AI_USER_AGENT_CLAUDE_ON = a UTC date puts the scheduled night on Claude, on the large tier, for that one night'
        required: false
      chain_links:
        description: 'Chain: run the plan over up to this many runs (2-4), each capped at 250k tokens, the next restoring the data the last one left; empty = one run'
        required: false
      chain_from:
        description: 'Set by a chain itself: the run id of the link before this one (its artifact holds the snapshot and the summary)'
        required: false
      lane:
        description: 'Parallel lane 1-4: its own concurrency group, so lanes run at the same time; each draws goals from its own part of the move pool, split by the seed (no goal in two lanes of one seed; the seed is required and shared by the batch), tests this commit and FILES its findings like a night, and never reads or pushes the nights'' memory. Start the lanes of a batch with one seed'
        required: false
      video:
        description: 'Record this manual session (14 days; untick to disable). Scheduled sessions keep recording off.'
        type: boolean
        default: true

permissions:
  contents: write   # the agent-memory branch (the notes of the nights)
  issues: read
  actions: write   # the chain starts its next link (workflow_dispatch) when it goes on
  id-token: write   # GitHub's per-run token the AI broker checks (desktop/e2e/lib/broker-client.mjs)

# Why (7 Nov 2026, pz, owner via mac-50: "several AI persona at the same time"): a lane has its own group per lane number, so up to 4 lanes of one batch run together (one lane number twice still queues); a lane is no replay, so it files. Before: only a replay had its own group and replays file nothing, so parallel runs found bugs and never filed them.
# Why (3 Nov 2026, code review on 8/12): a group keeps one running and one pending run and cancels an older pending one, so replays dispatched one after another would cancel each other and a replay could cancel the pending nightly (the watchdog would then report a missing start); a replay has its own group per run.
concurrency:
  group: ai-user-agent${{ inputs.lane != '' && format('-lane-{0}', inputs.lane) || (inputs.plan != '' || inputs.app_ref != '' || inputs.rules_off != '' || inputs.shape != '' || inputs.tier != '' || inputs.screen != '' || inputs.chain_links != '' || inputs.chain_from != '' || inputs.engine != '') && format('-replay-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  session:
    name: One session
    if: vars.AI_USER_AGENT != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IS_REPLAY: ${{ inputs.lane == '' && (inputs.plan != '' || inputs.app_ref != '' || inputs.rules_off != '' || inputs.shape != '' || inputs.tier != '' || inputs.screen != '' || inputs.chain_links != '' || inputs.chain_from != '' || inputs.engine != '') && '1' || '' }}   # Why (5 Nov 2026, Gitar on #3212): "is this a replay" was written in six places that disagreed; a run that sets a plan, an app commit, rules off, a shape, a tier, the screen reader switch, an engine or a chain link measures one state, so it is labelled, concurrency-separated, uploaded apart and never reads or pushes the nights' memory, so a lane is no replay and `IS_REPLAY` stays empty for it (7 Nov 2026, pz). The concurrency group above cannot read this env and repeats the same expression (7 Nov 2026, pz: a lane, set by `lane`, is none of these: it tests this commit, files and reads no memory, so every replay input but tier, seed, shape, screen and video is refused in the first step)
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts/agent
      E2E_STORE: sqlite
      CI_FREE_AI_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}   # the cap's account and token the Free AI meter reads (lib/ai-cap.mjs), as in e2e.yml's suite job (tests/tooling/ci/test_ci_free_ai.py)
      CI_CF_ANALYTICS_TOKEN: ${{ secrets.CI_CF_ANALYTICS_TOKEN }}
      AI_USER_AGENT_MINUTES: ${{ vars.AI_USER_AGENT_MINUTES }}
      AI_USER_AGENT_CALLS: ${{ vars.AI_USER_AGENT_CALLS }}
      AI_USER_AGENT_STEPS: ${{ vars.AI_USER_AGENT_STEPS }}
      AGENT_ENGINE: ${{ inputs.engine }}   # Why (5 Nov 2026, owner: "Try Claude on one night"): both the ping (prepare) and the actor (the session) read the same two values
      AGENT_CLAUDE_ON: ${{ vars.AI_USER_AGENT_CLAUDE_ON }}
    steps:
      # Why (7 Nov 2026, pz): a lane files what it finds, and a bug found on an OLD app commit or under a named plan or with rules taken out is not one to file (the reason a replay files nothing), so those inputs fail the lane at once, before the runner is spent. Why (code review, same day): the lane number is checked HERE, not only in the suite after the install, because it names the concurrency group (" 1" and "1" would be two groups for one lane, "9" a lane that fails after ten minutes); and the batch's goals are split by the seed, which must therefore be given: a default seed (today's date) would split a batch that crosses midnight UTC two ways.
      - name: A lane has a number, the batch's seed, and tests this commit's app under the seeded goals only
        if: inputs.lane != ''
        env:
          LANE: ${{ inputs.lane }}
          SEED: ${{ inputs.seed }}
          REPLAY_INPUTS: ${{ inputs.plan }}${{ inputs.app_ref }}${{ inputs.rules_off }}${{ inputs.chain_links }}${{ inputs.chain_from }}${{ inputs.engine }}${{ inputs.scheduled && 'scheduled' || '' }}
        run: |
          [[ "$LANE" =~ ^[1-4]$ ]] || { echo "lane must be a whole number from 1 to 4, got: '$LANE'" >&2; exit 1; }
          [[ "$SEED" =~ ^[0-9]+$ ]] || { echo "the lanes of a batch share one seed (digits only): set seed, got: '$SEED'" >&2; exit 1; }
          [ -z "$REPLAY_INPUTS" ] || { echo "A lane files its findings, so it takes no plan, app_ref, rules_off, chain, engine or scheduled input (those make a replay, which files nothing). Use tier, seed, shape, screen and video only." >&2; exit 1; }
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          fetch-depth: 300   # the commits since the last session (git log <last>..HEAD); a last session older than this shows the last 30
      # Why (3 Nov 2026, AI user agents 8/12): the agent did not exist at the commit before a tester bug's fix, and the second fix does not revert cleanly on main, so a replay runs the app of that commit under today's tests and agent:
      # the whole tree at app_ref, then the harness, the knowledge, the tools and the local actions put back from this commit. The ref comes through the environment and must be a hex SHA.
      - name: The app as it was, the tests and the agent as they are (replay only)
        if: inputs.app_ref != ''
        timeout-minutes: 5
        env:
          APP_REF: ${{ inputs.app_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APP_REF" =~ ^[0-9a-f]{7,40}$ ]] || { echo "app_ref must be a 7-40 character hex commit, got: $APP_REF"; exit 1; }
          # git fetch takes only a full SHA by name; GitHub's API resolves a short one.
          FULL="$(gh api "repos/$GITHUB_REPOSITORY/commits/$APP_REF" --jq .sha)"
          NOW="$(git rev-parse HEAD)"
          git fetch --quiet --depth=1 origin "$FULL"
          git checkout --quiet --detach FETCH_HEAD
          rm -rf desktop/e2e docs/app-expectations tools .github/actions
          git checkout "$NOW" -- desktop/e2e docs/app-expectations tools .github/actions
          # Why (4 Nov 2026, replays 41854824553 and 41854829958): agent-seed.mjs reads the CV read's file name and hash from this node-only app file, which is newer than the commits a replay tests ("Cannot find module desktop/lib/cv-read-key.js"); an app file the harness imports and an older commit lacks is put back here, one line each.
          git checkout "$NOW" -- desktop/lib/cv-read-key.js
          echo "The app is $(git rev-parse --short FETCH_HEAD); the tests, the agent, the knowledge and the tools are $(git rev-parse --short "$NOW")." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: Electron's zip from the cache (a GitHub 504 only hits a cold cache)
        timeout-minutes: 5
        uses: ./.github/actions/electron-cache
      - name: Install the app
        timeout-minutes: 5
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: npm ci || npm install
      # Why (4 Nov 2026, filmed run 41860394127 kept no video): the recorder finds Playwright's own ffmpeg beside its browsers (ready-fill/fill-video.mjs findFfmpeg), and this job installs none, so a run with video on filmed nothing. Only a filmed run pays for it.
      - name: Playwright's ffmpeg, for a filmed run
        if: inputs.video && !inputs.scheduled
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: npx playwright-core install ffmpeg
      - name: Python packages the engine needs
        timeout-minutes: 5
        run: pip install --quiet -r requirements.txt
      - name: A virtual display and Electron's libraries
        timeout-minutes: 5
        run: bash tools/apt-install.sh xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 fonts-noto-color-emoji fonts-dejavu-core
      # Why (26 Oct 2026, e2e.yml): the Free AI relay comes from this workflow's own commit; the checkout above is that commit, so the local action is used as it is here.
      - name: Free AI relay (the app under test answers through it; CI's own Workers AI token)
        timeout-minutes: 5
        uses: ./.github/actions/free-ai-relay
        with:
          public-tree: .
          cf-token: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          cf-account: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          app-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ vars.OWNER_OF_WEB }}
      - name: Record which commit this run tested (ui-findings.yml names it in every issue)
        timeout-minutes: 5
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s %s\n' "${{ github.ref_name }}" "$(git rev-parse HEAD)" > "$E2E_ARTIFACTS/tested.txt"
      # Why (5 Nov 2026, SC 2/2, owner: "chained runs"): link n+1 starts from the artifact of link n (its snapshot of the app's data and its summary); the run id is digits only.
      - name: The previous link's snapshot and summary (a chained run only)
        if: inputs.chain_from != ''
        timeout-minutes: 5
        env:
          FROM: ${{ inputs.chain_from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$FROM" =~ ^[0-9]+$ ]] || { echo "chain_from must be a run id, got: $FROM"; exit 1; }
          gh run download "$FROM" -R "$GITHUB_REPOSITORY" -n "agent-replay-$FROM" -D "$RUNNER_TEMP/chain-prev"
          echo "AGENT_CHAIN_DIR=$RUNNER_TEMP/chain-prev/agent-chain-out" >> "$GITHUB_ENV"
      - name: Who answers, how big tonight's session is, what the agent remembers and what changed since
        id: prepare
        timeout-minutes: 10
        working-directory: desktop/e2e
        run: node agent-nightly.mjs prepare
      - name: What the persona's closed false alarms taught (closed by-design verdicts, read from GitHub)
        id: closed
        if: steps.prepare.outputs.skip != 'true' && !env.IS_REPLAY
        timeout-minutes: 3
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
        # Why (7 Nov 2026, pz, owner via mac-50: "are we treating the root cause?"): the actor and the judge read the area's closed by-design verdicts like rules (lib/agent-closed.mjs). A GitHub read that fails must not end a night: the run goes without them and says so here and in the suite's log.
        run: |
          if node lib/agent-closed.mjs "$RUNNER_TEMP/closed-verdicts.json"; then echo "file=$RUNNER_TEMP/closed-verdicts.json" >> "$GITHUB_OUTPUT"; else echo "::warning::closed verdicts could not be read: this run goes without them"; fi
      - name: The AI user agent works its session
        id: session
        if: steps.prepare.outputs.skip != 'true'
        timeout-minutes: 45   # the suite stops itself at its minute cap plus 5 (suites/agent.mjs); this only ends a hung runner
        working-directory: desktop/e2e
        env:
          JOBADABRA_TESTER_KEY: ${{ !env.IS_REPLAY && secrets.REPLAYS_PUBLISH_KEY || '' }}   # only the isolated persona app receives this; tester-mode takes it out of its environment at import
          AGENT_SEED: ${{ inputs.seed }}
          AGENT_PLAN: ${{ inputs.plan }}
          AGENT_SHAPE: ${{ inputs.shape }}
          AGENT_TIER: ${{ inputs.tier }}
          AGENT_LANE: ${{ inputs.lane }}
          AGENT_SCREEN: ${{ inputs.screen }}
          AGENT_CHAIN_LINKS: ${{ inputs.chain_links }}
          AGENT_RULES_OFF: ${{ inputs.rules_off }}
          AGENT_KIND: ${{ env.IS_REPLAY && 'replay' || inputs.lane != '' && 'lane' || 'night' }}   # Why (5 Nov 2026, AI user agents 9/12 part 2b, owner: "Nightly and replays, replays labelled"): the Admin tab lists nights, lanes and replays and marks a replay; a run that picks a shape or a tier is a measurement too, so it never counts as a night (code review of the tier input); a lane (7 Nov 2026, pz) is a third kind, 'lane': it files like a night but is not one, so the night's goal rate never mixes with the lanes' (the Admin page still draws it as a night until it learns the chip)
          AGENT_VIDEO: ${{ inputs.video && !inputs.scheduled && '1' || '' }}   # Why (7 Nov 2026, owner): manual investigations record by default; scheduled nights retain their existing storage cost
          AGENT_MEMORY_DIR: ${{ !env.IS_REPLAY && inputs.lane == '' && steps.prepare.outputs.memory_dir || '' }}   # a replay or a lane knows no earlier night (a lane would otherwise plan against the night's coverage), so its runs compare
          AGENT_CHANGED_LOG: ${{ !env.IS_REPLAY && inputs.lane == '' && steps.prepare.outputs.changed_log || '' }}   # same replay-or-lane condition as the memory: no earlier night, no "changed since"
          AGENT_CLOSED_FILE: ${{ !env.IS_REPLAY && steps.closed.outputs.file || '' }}   # lanes read it too: a lane has no memory, and the closed verdicts are what it can learn from
          E2E_AGENT_MINUTES: ${{ steps.prepare.outputs.minutes }}
          E2E_AGENT_CALLS: ${{ steps.prepare.outputs.calls }}
          E2E_AGENT_STEPS: ${{ steps.prepare.outputs.steps }}
          E2E_AGENT_STEP_TOKENS: ${{ steps.prepare.outputs.step_tokens }}   # Why (7 Nov 2026, #3378): what one step costs on the engine that answered; the session sizes its goals from it and the token meter
        run: xvfb-run -a --server-args='-screen 0 1440x900x24 -noreset' node suite.mjs agent
      - name: The summary of the night (cost, verdict per goal, or why there was none)
        if: always()
        timeout-minutes: 5
        env:
          SKIPPED: ${{ steps.prepare.outputs.skip }}
          NOTE: ${{ steps.prepare.outputs.note }}
        run: |
          {
            echo "### AI user agent · ${NOTE:-no note}"
            if [ -f "$E2E_ARTIFACTS/agent-summary.md" ]; then cat "$E2E_ARTIFACTS/agent-summary.md"
            elif [ "$SKIPPED" = true ]; then echo "No session was run."
            else echo "The session left no summary: see the log of the step above."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Why (3 Nov 2026, code review): the scan comes first and fails closed, as in e2e.yml; the notes pushed to the public agent-memory branch and the uploaded artifact both come after it.
      - name: Scan artifact contents for CI secrets
        id: artifact_scan
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          JOBADABRA_TESTER_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
          E2E_ARTIFACT_SECRET_NAMES: |
            ACTIONS_ID_TOKEN_REQUEST_TOKEN
            JOBADABRA_TESTER_KEY
            CI_CF_ANALYTICS_TOKEN
            E2E_FREE_AI_KEY
            FREE_AI_LOCAL_CF_ACCOUNT_ID
            FREE_AI_LOCAL_CF_AI_TOKEN
            GH_TOKEN
          E2E_ARTIFACT_PATHS: e2e-artifacts/agent
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - name: Keep the night's notes on the agent-memory branch
        if: always() && steps.prepare.outputs.skip != 'true' && steps.artifact_scan.outcome == 'success' && !env.IS_REPLAY && inputs.lane == ''   # a lane never writes the night's memory (pz, 7 Nov 2026)
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: node agent-nightly.mjs publish
      # Why (4 Nov 2026, AI user agents 9/12 part 2b, owner: "video recording for each" run, kept 14 days): after the scan, like the memory push, so a file with a CI secret in it is never sent; the line it prints is the whole report, a refused file never fails the night.
      - name: Send the run to Admin → AI persona (pictures, video, record)
        if: always() && steps.prepare.outputs.skip != 'true' && steps.artifact_scan.outcome == 'success'
        timeout-minutes: 10
        working-directory: desktop/e2e
        env:
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
        shell: bash   # Why (7 Nov 2026, pz): `| tee` hides the command's exit code without pipefail; the same pipe let the judge exam step (run 42410653476) show success after a crash
        run: node agent-run-upload.mjs "$E2E_ARTIFACTS" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      # The same artifact name pattern an e2e suite uses, so ui-findings.yml files this run's findings without a second reader; a replay run is named otherwise, so the Finder never files a bug that was fixed long ago.
      - name: Screenshots, findings, summary and trace
        if: always() && steps.artifact_scan.outcome == 'success' && hashFiles('e2e-artifacts/agent/**') != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.IS_REPLAY && format('agent-replay-{0}', github.run_id) || 'e2e-artifacts-agent' }}
          path: e2e-artifacts/agent
          if-no-files-found: ignore
          retention-days: 14   # Why (4 Nov 2026, owner: video storage): the video is the big file; 14 days is the Lab's fill videos' keep time
      # Why (5 Nov 2026, SC 2/2): the next link starts only after this run's artifact (with the snapshot) is uploaded; a chain that has ended says why in the summary and starts nothing.
      - name: Continue the chain (the next run, from this run's snapshot)
        if: success() && hashFiles('e2e-artifacts/agent/agent-chain.json') != ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          IN_PLAN: ${{ inputs.plan }}
          IN_SHAPE: ${{ inputs.shape }}
          IN_RULES_OFF: ${{ inputs.rules_off }}
          IN_SCREEN: ${{ inputs.screen }}
          IN_APP_REF: ${{ inputs.app_ref }}
          IN_ENGINE: ${{ inputs.engine }}
          IN_VIDEO: ${{ inputs.video }}
          IN_SCHEDULED: ${{ inputs.scheduled }}
        run: |
          STATE=e2e-artifacts/agent/agent-chain.json
          ENDED="$(jq -r .ended "$STATE")"
          if [ -n "$ENDED" ]; then echo "Chain $(jq -r .chain "$STATE") ended after link $(jq -r .link "$STATE"): $ENDED" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # Why (7 Nov 2026, owner): carry every setting, including recording and scheduled status, so a later chain link cannot undo a manual video opt-out or start recording a scheduled run.
          ARGS=(-f chain_from="$GITHUB_RUN_ID" -f tier="$(jq -r .tier "$STATE")" -f seed="$(jq -r .plan.seed "$STATE")" -f video="$IN_VIDEO" -f scheduled="$IN_SCHEDULED")
          add() { if [ -n "$2" ]; then ARGS+=(-f "$1=$2"); fi; }
          add plan "$IN_PLAN"; add shape "$IN_SHAPE"; add rules_off "$IN_RULES_OFF"; add screen "$IN_SCREEN"; add app_ref "$IN_APP_REF"; add engine "$IN_ENGINE";
          gh workflow run ai-user-agents.yml --ref "$GITHUB_REF_NAME" "${ARGS[@]}"
          echo "Chain $(jq -r .chain "$STATE"): link $(jq -r '.link + 1' "$STATE") started from this run." | tee -a "$GITHUB_STEP_SUMMARY"
