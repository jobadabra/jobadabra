name: AI fixer
run-name: Send to AI ${{ inputs.ref }}

# "Send to AI" on a feedback card of the site (owner, 3 Nov 2026: "send it to a claude session (on the CI using the ai-broker), that the outcome should be a PR with the fix"). ONE run per click of the owner's;
# the site starts it (workflow_dispatch, input `ref` only, with the timers' token), at most 10 a day and 1 at a time. The run reads that one report from the site with GitHub's own run token (audience
# jobadabra-feedback; no secret), lets the Codex plan propose a fix (desktop/e2e/edit-codex.mjs, two broker calls, no tools), checks it and opens a DRAFT pull request for the owner. It never merges and never
# pushes to main. The UI Fixer (ui-fix.yml, scheduled, many findings) stays OFF (owner, 25 Oct 2026); this runs only on a click.
# THIS REPOSITORY IS PUBLIC: the branch, the pull request, the run log and the artifacts are public. tools/feedback-ai.mjs never prints the report, redacts it a second time before the AI reads it,
# and refuses to push when the pull request text or the change holds an e-mail, a secret, a home-folder name or a passage copied from the report.
# The AI's code and the tokens never meet (7/7 reviews, 3 Nov 2026; Gitar, mac-07). Trust by job: `guard` counts today's runs (read-only token); `fix` runs only OUR code (the AI's edits are applied as data by
# edit-codex.mjs, scanned and written as a patch; our script runs from a copy made before the AI step, because desktop/lib is a folder the AI may edit); `prove` runs the AI's new test and the suites inside a container with no network
# and no runner token (tools/feedback-ai-sandbox.sh), after installing the dependencies from main's files; `publish` (the only job that can push) starts from a fresh checkout, copies our script first, applies only the patch and calls the site without the write tokens in that call's environment;
# `report-failure` tells the site when any job broke. When such a pull request is merged or closed, feedback-ai-closed.yml tells the site (its own file since 5 Nov 2026, so a close draws 1 row, not 7).
# Guard: desktop/test/tooling/ci/feedback-ai.test.js; the site's side: jobadabra-web admin/feedback-ai.js (what it accepts: workflow_ref = this file on main, event workflow_dispatch; merged/closed also from this file until the site's follow-up of plan 2026-11-05-check-names 3/4).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The feedback's 16-character handle (the site sends it)"
        required: true

permissions: {}

jobs:
  # The CI side of the caps (the site enforces 1 at a time and 10 a day too; mac-07 on #3086: not only there). A READ-only token counts this workflow's runs of the UTC day; no AI, no write.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read   # the list of this workflow's runs
      contents: read
      id-token: write   # to tell the site why a run was refused
    env:
      REF: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            desktop/lib
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: At most 1 at a time and 10 a day
        run: node tools/feedback-ai.mjs cap --ref "$REF"

  fix:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read   # no write token in this job, and no AI-written code runs in it: the AI's edits are applied as data
      id-token: write   # the site and the Codex broker know a run by its OIDC token
    concurrency:
      group: feedback-ai   # one at a time (the site enforces it too); a second start waits instead of racing for the same checks
      cancel-in-progress: false
    outputs:
      go: ${{ steps.check.outputs.go }}
      sha: ${{ steps.check.outputs.sha }}   # of the four files below; publish compares it, so an artifact swapped after the scan is refused (a job's outputs cannot be written by a later job)
    env:
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Keep a copy of our script that the patch cannot change (desktop/lib is a folder the AI may edit)
        run: |
          mkdir -p "$RUNNER_TEMP/fbt"
          cp --parents tools/feedback-ai.mjs desktop/lib/feedback-bundle.js tools/fixer/*.mjs "$RUNNER_TEMP/fbt/"
          echo "FBT=$RUNNER_TEMP/fbt" >> "$GITHUB_ENV"
      - name: Read the report (never printed)
        run: node "$FBT/tools/feedback-ai.mjs" brief --ref "$REF" --out .fb
      - name: Codex proposes the fix (files only; two broker calls)
        id: fixer
        # The folders a fix may touch are the UI fixer's (check-change.mjs checks them again below); no .github/, tools/ or package files. --quiet: the log never carries a path the AI chose.
        # --data: the report goes to the AI as fenced DATA in the user message, never in the system prompt (.fb/prompt.md holds the instructions only).
        run: >-
          node desktop/e2e/edit-codex.mjs --prompt .fb/prompt.md --data .fb/report.md --roots desktop/renderer,desktop/lib,desktop/test,src,tests
          --allow '^(desktop/(renderer|lib)/|src/|desktop/test/((unit|guards)/[A-Za-z0-9_-]+/)?[A-Za-z0-9._-]+\.test\.js$|tests/((unit|guards)/[A-Za-z0-9_]+/)?test_[A-Za-z0-9_]+\.py$)'
          --verdicts fixed-already,not-reproducible,needs-human,false-positive --none-as verdict --none-out .fb/verdict.md --body-out .fb/pr-body.md --quiet
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-capped-feedback   # present only when the broker refused (its file holds no report text)
          path: ${{ runner.temp }}/ai-capped/ai-capped.json
          if-no-files-found: ignore
      - name: Check the proposed change and write its patch
        id: check
        env:
          FIXER_OUTCOME: ${{ steps.fixer.outcome }}
          AI_SKIPPED: ${{ steps.fixer.outputs.skipped }}   # the broker refused on its budget (a lost login or a broker down fails the fixer step instead: FIXER_OUTCOME)
        run: |
          set -euo pipefail
          tell() { node "$FBT/tools/feedback-ai.mjs" report --ref "$REF" "$@"; }
          # Every refusal tells the site WHY in words of our own (never the report's), so the card shows it; a run that stops here is red.
          stop() { tell --status failed --why "$1" || true; echo "::error::$1"; exit 1; }
          if [ "$AI_SKIPPED" = true ]; then stop "the AI broker refused the call (its budget is used up): see the run's warning"; fi
          if [ "$FIXER_OUTCOME" != success ]; then stop "the AI step did not run ($FIXER_OUTCOME)"; fi
          roots="src desktop/renderer desktop/lib desktop/test tests"
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v -E '^(\.fb/|e2e-artifacts/)' || true)
          if [ -z "$changed" ]; then
            verdict=$(head -1 .fb/verdict.md 2>/dev/null | tr -d '[:space:]' || true)
            reason=$(sed -n '2,$p' .fb/verdict.md 2>/dev/null | sed 's/^Why: *//' | head -3 | tr '\n' ' ' || true)
            tell --status none --verdict "${verdict:-needs-human}" --why "${reason:-the AI answered with no change and no reason}"
            echo "The AI proposed no change (${verdict:-needs-human}); the card shows its reason."
            echo "go=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed" | node desktop/e2e/check-change.mjs || stop "the proposed change touched files a fix may not touch, or had no test"
          # At most 72 BYTES in all (the title is the commit subject): the prefix is 25, so the AI's part is cut to 44 at a word.
          summary=$(node -e 'const t=((require("fs").readFileSync(".fb/pr-body.md","utf8").split("\n")[0])||"").trim(); const b=x=>Buffer.byteLength(x); if(b(t)<=44){console.log(t)}else{let c=[...t]; while(b(c.join(""))>43)c.pop(); console.log(c.join("").replace(/\s+\S*$/,"")+"…")}')
          [ -n "$summary" ] || summary="fix from a report"
          printf '%s\n' "$summary" > .fb/summary.txt
          printf '%s\n' "[fd-ai] $REF $summary" > .fb/title.txt
          sed '1,2d' .fb/pr-body.md > .fb/body.md
          node "$FBT/tools/feedback-ai.mjs" leaks --out .fb --title .fb/title.txt --body .fb/body.md || stop "the change or its text held something that may not be public (an e-mail, a secret, a home folder, a phone number or a passage copied from the report): nothing was pushed"
          # shellcheck disable=SC2086
          git add -N -- $roots
          # shellcheck disable=SC2086
          git diff --no-renames --binary -- $roots > .fb/change.patch
          # The second wall (check-change.mjs is the first): no workflow, tool, hook, agent-instruction, package, secret or config file, at most 8 files and 60 KB.
          echo "$changed" | node "$FBT/tools/feedback-ai.mjs" gate --bytes "$(wc -c < .fb/change.patch)" || stop "the change touches files a fix may never touch, or is too big (8 files, 60 KB)"
          echo "sha=$(cat .fb/change.patch .fb/title.txt .fb/summary.txt .fb/body.md | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "go=pr" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: steps.check.outputs.go == 'pr'
        with:
          name: fd-ai-patch   # the patch and the pull request text, all scanned above; never the report (.fb/brief.json and report.md are not listed)
          path: |
            .fb/change.patch
            .fb/title.txt
            .fb/summary.txt
            .fb/body.md
          retention-days: 3

  # The only job that runs the AI's code (its new test, then the whole suites and the lint). It has no secret and no write permission (id-token is not granted), and the AI's code never runs on the runner itself:
  # every command of it goes through tools/feedback-ai-sandbox.sh, a container with no network (so no cache service and no runner token), no capabilities and only the workspace to write.
  prove:
    needs: fix
    if: needs.fix.outputs.go == 'pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      why: ${{ steps.proof.outputs.why }}   # words of ours; the report-failure job passes it through an env var, clipped by the site
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Keep a copy of our scripts that the patch cannot change (desktop/lib is a folder the AI may edit)
        run: |
          mkdir -p "$RUNNER_TEMP/fbt"
          cp --parents tools/feedback-ai.mjs tools/feedback-ai-sandbox.sh tools/feedback-ai.Dockerfile desktop/lib/feedback-bundle.js tools/fixer/*.mjs "$RUNNER_TEMP/fbt/"
          echo "FBT=$RUNNER_TEMP/fbt" >> "$GITHUB_ENV"
          echo "PYDEPS=$RUNNER_TEMP/pydeps" >> "$GITHUB_ENV"
      # The dependencies are installed from main's own files BEFORE the patch is applied, so a patch cannot change what is installed or run an install script on the runner.
      - name: Install the app's dependencies (for its tests)
        working-directory: desktop
        run: npm ci
      # No `cache: pip` here (7/7 review): a cache is saved in the action's post step and a main-scoped job could restore it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the engine's dependencies (for its tests)
        run: pip install --quiet --target "$PYDEPS" -r requirements.txt
      - name: Build the box the AI's code runs in
        run: docker build --quiet --tag fd-ai-proof --file "$FBT/tools/feedback-ai.Dockerfile" "$(mktemp -d)"
      - uses: actions/download-artifact@v7
        with:
          name: fd-ai-patch
          path: .fb
      - name: Apply the patch
        run: git apply .fb/change.patch
      # The box gets its OWN copy: the runner never reads or writes inside it (a symlink or a .git/config the AI plants in the real workspace would run on the runner: 7/7 Gitar review). Logs go to $RUNNER_TEMP.
      - name: Copy the patched workspace for the box
        run: |
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/box"
          echo "BOX=$RUNNER_TEMP/box" >> "$GITHUB_ENV"
      - name: The new test must fail on an assertion without the fix and pass with it
        id: proof
        run: |
          set -euo pipefail
          if ! bash "$FBT/tools/feedback-ai-sandbox.sh" node /fbt/tools/feedback-ai.mjs proof; then echo "why=the new test does not fail on an assertion without the fix and pass with it" >> "$GITHUB_OUTPUT"; exit 1; fi
      - name: The whole suites and the lint must pass with the fix
        run: |
          set -euo pipefail
          bash "$FBT/tools/feedback-ai-sandbox.sh" bash -c 'cd desktop && npm test && npm run lint' > "$RUNNER_TEMP/suite.log" 2>&1 || { echo "the whole desktop suite or the lint failed with the fix"; exit 1; }
          bash "$FBT/tools/feedback-ai-sandbox.sh" python3 -m unittest discover -s tests >> "$RUNNER_TEMP/suite.log" 2>&1 || { echo "the whole Python suite failed with the fix"; exit 1; }

  # The only job that can push. A fresh checkout; it copies our script BEFORE applying the patch (the patch may change desktop/lib), applies the patch `fix` wrote, checks its paths again and opens a DRAFT pull request.
  # Never merges, never marks ready, never pushes anywhere but fd-ai/<ref>.
  publish:
    needs: [fix, prove]
    if: needs.fix.outputs.go == 'pr' && needs.prove.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the branch fd-ai/<ref>
      pull-requests: write   # the draft pull request and its label
      id-token: write   # to tell the site (its OIDC proof)
    env:
      REPO: ${{ github.repository }}
      REF: ${{ inputs.ref }}
      PATCH_SHA: ${{ needs.fix.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Keep a copy of our script that the patch cannot change (desktop/lib is a folder the AI may edit)
        run: |
          mkdir -p "$RUNNER_TEMP/fbt"
          cp --parents tools/feedback-ai.mjs desktop/lib/feedback-bundle.js tools/fixer/*.mjs "$RUNNER_TEMP/fbt/"
          echo "FBT=$RUNNER_TEMP/fbt" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: fd-ai-patch
          path: .fb
      # GitHub starts no workflow for a push or PR made with GITHUB_TOKEN, so the PR would sit without checks: push and open it with the CI GitHub App's token (else the workflow token, and no checks).
      - name: The App token, so the PR's checks start
        id: pr_app
        continue-on-error: true   # a failed mint falls back to the workflow token, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Apply the patch, open the draft pull request, tell the site
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ steps.pr_app.outputs.token }}
        run: |
          set -euo pipefail
          # The site is told by OUR copy, with the write tokens out of that call's environment (the patch below may change desktop/lib).
          tell() { env -u GH_TOKEN -u PR_TOKEN node "$FBT/tools/feedback-ai.mjs" report --ref "$REF" "$@"; }
          stop() { tell --status failed --why "$1" || true; echo "::error::$1"; exit 1; }
          [[ "$REF" =~ ^[0-9a-f]{16}$ ]] || stop "not a feedback handle"
          # The files are the ones `fix` scanned (its output, which no later job can write), not a swapped artifact.
          [ "$(cat .fb/change.patch .fb/title.txt .fb/summary.txt .fb/body.md | sha256sum | cut -d' ' -f1)" = "$PATCH_SHA" ] || stop "the patch is not the one that was scanned"
          # The patch again, as if it were a stranger's: only the allowed folders, no link, no mode change, no rename (check-change.mjs is the same rule the fix job used).
          if grep -q -E '^(old mode|new mode|rename |similarity |deleted file mode)' .fb/change.patch || grep -E '^new file mode ' .fb/change.patch | grep -q -v ' 100644$'; then stop "the patch renames or deletes a file, changes a mode, or adds a link"; fi
          git apply --numstat .fb/change.patch | awk '{print $3}' | node desktop/e2e/check-change.mjs || stop "the patch touches files a fix may not touch, or has no test"
          git apply --numstat .fb/change.patch | awk '{print $3}' | node "$FBT/tools/feedback-ai.mjs" gate --bytes "$(wc -c < .fb/change.patch)" || stop "the patch touches files a fix may never touch, or is too big (8 files, 60 KB)"
          git apply .fb/change.patch
          git add -A -- src desktop/renderer desktop/lib desktop/test tests
          title=$(cat .fb/title.txt); summary=$(cat .fb/summary.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="fd-ai/$REF"
          git checkout -q -b "$branch"
          tools/bot-commit.sh "$title" "the fix is proven by its own unit test (fails before on an assertion, passes after) and the suites, not by a page"
          # -f: the branch is this workflow's own namespace; a second run for the same report (the owner closed the first pull request) replaces the old branch.
          git push -q -f "https://x-access-token:${PR_TOKEN:-$GH_TOKEN}@github.com/$REPO.git" "$branch"
          tools/bot-pr-body.sh HEAD~1 --verdict="🟢 $summary" --why="a person reported it in the app and the owner sent it to the AI" \
            --unblocks="that report, once the owner reviews and merges" --label="Report $REF" --before='the bug is open' --after='fixed by this change' \
            --rate='Real users=🟡 Medium|a reported bug fixed' --rate='Tests & harness=🟡 Medium|a test with the fix' --detail=.fb/body.md > .fb/laid-out.md
          # The checks that hold secrets (smoke, search personas, page cases) skip a bot's fd-ai/ branch: AI-written code must not meet a secret before a person has read it.
          # shellcheck disable=SC2016
          printf '\n> ⏸ **Some checks wait for you.** Read the diff first; then push any commit to this branch (`git commit --allow-empty -m "start checks"`) to start the checks that hold secrets.\n' >> .fb/laid-out.md
          gh label create fd-ai --repo "$REPO" --force --color 5319E7 --description 'A draft fix from the site: Send to AI on a feedback'
          url=$(GH_TOKEN="${PR_TOKEN:-$GH_TOKEN}" gh pr create --repo "$REPO" --base main --head "$branch" --draft --title "$title" --body-file .fb/laid-out.md --label fd-ai)
          echo "Draft pull request opened: $url"
          tell --status pr --pr "$url"

  # Tells the site when any job above broke, so the card shows why instead of staying "AI running" (the site also sends a silent run back after an hour). A fresh checkout and no write token: nothing the AI wrote runs here.
  report-failure:
    needs: [guard, fix, prove, publish]
    if: always() && (needs.guard.result == 'failure' || needs.fix.result == 'failure' || needs.prove.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      REF: ${{ inputs.ref }}
      WHY: ${{ needs.prove.outputs.why }}   # passed as an environment variable, never inside the script text
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            desktop/lib
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # A job that already told the site (a refusal with its reason) makes the site refuse this one, harmlessly.
      - name: Tell the site
        run: |
          # `why` comes from the job that ran the AI's code, which can write any output: only the one sentence our own step writes is passed on (7/7 review).
          case "$WHY" in
            "the new test does not fail on an assertion without the fix and pass with it") reason="$WHY" ;;
            *) reason="the run broke before it finished, see the run" ;;
          esac
          node tools/feedback-ai.mjs report --ref "$REF" --status failed --why "$reason" || true

  # One alert when the broker refused the run (owner, 31 Oct 2026: one alert per run); the note it reads holds the cause, never any report text.
  ai-skipped:
    needs: fix
    if: always() && !cancelled() && needs.fix.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            desktop/e2e
            .github/actions
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: ./.github/actions/ai-skipped-alert
        with:
          bot-token: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          github-token: ${{ github.token }}
