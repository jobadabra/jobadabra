name: CI · Search reference (18 personas)
# The yardstick of the nightly Search check (owner, 6 Nov 2026: "how to know if it's a good or bad result?"; chose "EURES direct + Google Jobs weekly"): for each of the 18 fictional candidates, how many right-role,
# right-place jobs exist, read outside the app (EURES's public API; one Google Jobs search through SerpApi) and judged by the same blind judge as the night. Counts go to Admin → Job search → Night search
# ("found 7 of 24 reachable"); nothing else leaves. A report: it blocks nothing. Tool: tools/persona-search/reference.py (read, judge, send). Guard: tests/tooling/ci/test_search_reference.py.
# By hand for now: no schedule until the owner decides the SerpApi quota (18 searches a week, about 72 a month; REFERENCE_SERPAPI_KEY is its own secret, never the scout's). Without that secret Google Jobs reads
# "no key" and only EURES is counted.
run-name: Search reference · by hand

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:   # Why (6 Nov 2026): its own group, not the nightly's: a queued reference must not replace a queued night (GitHub keeps one pending run per group); it is short, about 5 minutes of broker
  group: search-reference
  cancel-in-progress: false

env:
  CI_AI_PROVIDER: codex
  E2E_AI_PROVIDER: codex
  JOBADABRA_MODEL_OVERRIDE: claude-haiku-5-5   # as the nightly check: the blind judge on the small tier through the Codex broker

jobs:
  reference:
    name: Search reference
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # the broker's GitHub OIDC, no stored secret
    steps:
      - name: This run can use the Codex broker
        id: token
        run: |
          mkdir -p out
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::warning::No trusted GitHub OIDC token: the reference is not judged"
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'yes'
        with: {persist-credentials: false}
      - uses: ./.github/actions/gh-ledger
        if: steps.token.outputs.ok == 'yes'
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'yes'
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        if: steps.token.outputs.ok == 'yes'
        with: {python-version: '3.12'}
      - name: The engine's libraries (the EURES reader, the judge)
        if: steps.token.outputs.ok == 'yes'
        run: |
          pip install --quiet -r requirements.txt
          (cd desktop/e2e && (npm ci || npm install))
      # Why (6 Nov 2026): codex.mjs strips every *_KEY variable from its child, so the SerpApi key is used here, in a step with no AI, and the judge below never sees it.
      - name: Read EURES and Google Jobs for the 18 candidates (no AI)
        if: steps.token.outputs.ok == 'yes'
        env:
          REFERENCE_SERPAPI_KEY: ${{ secrets.REFERENCE_SERPAPI_KEY }}
        run: |
          set -o pipefail
          python3 tools/persona-search/reference.py read out/rows.json 2>&1 | tee out/read.log
      - name: The blind judge (right role, right place; Codex small tier)
        if: steps.token.outputs.ok == 'yes'
        run: |
          set -o pipefail
          node tools/persona-search/codex.mjs -- python3 tools/persona-search/reference.py judge out/rows.json out/reference.json 2>&1 | tee out/judge.log
      - name: Send the counts to Admin → Job search → Night search
        if: steps.token.outputs.ok == 'yes'
        continue-on-error: true
        timeout-minutes: 2
        env:
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
        run: python3 tools/persona-search/reference.py send out/reference.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: search-reference
          retention-days: 90
          path: |
            out/reference.json
            out/read.log
            out/judge.log
      - if: always() && steps.token.outputs.ok == 'yes'
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
