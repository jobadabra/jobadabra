name: CI · Prompt cases (by-hand re-ask)
# A manually dispatched run compares the selected ref with main on the live prompt case sets, asked on the owner's Codex plan through the AI broker (small tier, tools/prompt-cases-live.mjs, the same asker
# as the nightly replay), and fails when a case got worse, the case it adds is wrong, or the broker did not answer. The run's call count is in its log and in the "Prompt cases" status line.
# Why (owner, 27 Oct 2026): a session reworded a prompt to pass one benchmark case; "another session can come tomorrow and redo that prompt for a different use-case
# and basically introducing a regression". AI in PR checks: "To be very cheap … that's very important".
# Why-changed (owner, 3 Nov 2026: "We should not use API Keys at all anymore. Everything should be around the ai-broker."): it asked Haiku 5.5 through Claude Code on the API key PR_PROOF_ANTHROPIC_KEY
# (owner, 27 Oct 2026, "Haiku on an API key"); no key, no `claude` install now: GitHub's per-run OIDC token proves the run to the broker. By hand only, so no calls a day on its own (up to 140 per run).
# Never the production Workers AI token or another key. Free AI runs qwen: this catches prompt regressions, not model ones.
on:
  # Why (owner, 27 Oct 2026): remove paid Haiku calls from automatic pull-request checks; keep them available by explicit dispatch.
  workflow_dispatch:

permissions:
  contents: read
  statuses: write       # the selected ref's "Prompt cases" status when the run could not ask
  id-token: write       # GitHub's per-run OIDC token proves the run to the AI broker; no API key

concurrency:
  group: prompt-cases-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  ask:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Which live case sets the selected ref reaches
        id: sets
        run: |
          sets=$(node tools/prompt-cases.mjs --live --base origin/main | tr '\n' ' ')
          echo "sets=$sets" >> "$GITHUB_OUTPUT"
          if [ -z "$sets" ]; then echo "No prompt of a live case set changed: nothing to ask."; else echo "Live case sets this ref reaches: $sets"; fi
      - name: Install the worker's packages
        if: steps.sets.outputs.sets != ''
        run: npm ci --prefix worker
      - name: Ask the cases with main's prompts and with this ref's (the AI broker)
        if: steps.sets.outputs.sets != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git worktree add -q "$RUNNER_TEMP/base" "$(git merge-base origin/main HEAD)"
          set +e
          node tools/prompt-cases-live.mjs --base-tree "$RUNNER_TEMP/base" --jobs 6 --max-calls 140 2>&1 | tee "$RUNNER_TEMP/prompt-cases.log"
          code=${PIPESTATUS[0]}
          set -e
          line=$(grep -E '^Right on main' "$RUNNER_TEMP/prompt-cases.log" | head -1 | cut -c1-90)
          calls=$(grep -E '^Calls:' "$RUNNER_TEMP/prompt-cases.log" | head -1 | cut -c1-40)
          [ -n "$line" ] || line=$(grep -E 'did not answer|over the cap' "$RUNNER_TEMP/prompt-cases.log" | head -1 | cut -c1-100)
          state=success; [ "$code" = 0 ] || state=failure
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state -f context="Prompt cases" -f description="${line:-the run ended before asking} ${calls}" >/dev/null || true
          exit "$code"
