name: CI · Search profiles (by hand)
# By hand only: the fictional profiles of the owner's profile round each press Find jobs once on a fresh CI install (the first search, EURES off, Codex through the
# broker as search-personas.yml does), the same blind judge counts their right jobs, and one table says, per profile: relevant, shown, first relevant at, boards read and
# with relevant jobs, what ran out of time, the engine and judge, the commit. Why (12 Nov 2026, owner, asked via AskUserQuestion by sa: "Move it to CI"): the round ran on
# the owner's Mac and its numbers followed the Mac's load (Cluj 18 -> 0 at load 24, 18 -> 21 at load 10, same code). A new series: never mixed with the Mac rows.
# Never a night, never sent to Admin, never red, no floors, no reference, no scoreboard.lock change (the 18 locked people and gate.py are only read); the Worker never starts it.
# One Telegram message per run (profiles.py tell, then desktop/e2e/tell-owner.mjs --event search-profiles through the switchboard). Tools: tools/persona-search/profiles.py (ids, free, cv, judge, row, table, tell), search-profiles.json, run.mjs (the press), gate.py extract, gate_judge.judge (the judge).
run-name: ${{ format('Search profiles · {0} · {1} at once · {2}', inputs.profiles || 'all', inputs.at_once || 4, inputs.engine || 'claude') }}

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Only these profile ids, a JSON list such as ["b02", "c06"] (empty = all)'
        type: string
        default: ''
      # Why (13 Nov 2026, owner: "make it very parallel" · "customizable"): any number 1-30, one dispatch away. A profile whose broker waits pass 20 s is reported not measured (sa),
      # so too many at once shows as waits, never as a low number.
      at_once:
        description: 'Profiles searching at once, 1 to 30 (more than the broker grants one claim, today 6, runs at that number; the run waits its place in line)'
        type: number
        default: 4   # Why (13 Nov 2026, owner via sa: "Claude, like the benchmark (Recommended)"; sa: the broker holds ~6 searches): 4 leaves room for a night or a benchmark beside it
      # Why (13 Nov 2026, owner via sa's AskUserQuestion: "Claude, like the benchmark (Recommended)"): on Codex every broker call took 10-11 s at least (16 output tokens = 11 s,
      # b05/b08 of run 43358450676), so a board's first page cost 55-65 s of chained calls and the round measured Codex's floor, not the app on Claude. Codex stays one dispatch away.
      engine:
        description: 'The AI of the search steps, on the app tiers (claude = as the app and the benchmark; codex = the earlier reading)'
        type: choice
        options: [claude, codex]
        default: claude
      # Why (13 Nov 2026, sa: the c04/d02 board jobs "read but never judged" need each job's stage to tell which pass lost it): off by default, one dispatch away.
      stage_log:
        description: 'One run-log line per job read with the stage that kept or lost it (src/sources/job_stage.py), as the night logs'
        type: boolean
        default: false

# Why (12 Nov 2026, sa): its own group, never search-personas: GitHub keeps one pending run per group, so joining the night's group could replace a queued night.
concurrency:
  group: search-profiles-${{ github.run_id }}   # Why (13 Nov 2026, owner: "yes, let's run the side by side"; asked by sa): a run of its own, so three by-hand rounds go side by side; their room is the broker's claim line (capacity 6, first come first served), never this group
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_AI_PROVIDER: codex   # the broker relay (codex.mjs); the engine behind it is JOBADABRA_CHECK_CHAIN below
  E2E_AI_PROVIDER: codex
  JOBADABRA_CHECK_CHAIN: ${{ inputs.engine == 'codex' && 'codex,claude' || 'claude' }}   # the search steps' AI; the judge keeps its own chain (its step)
  # Why (13 Nov 2026, owner: "Ok, let's swithc to Sonnet then"; asked via AskUserQuestion, "All but the replays (Recommended)"): no one-model override, so each
  # search step runs on the tier it names (small or main), as in the app; forced onto the small tier, the country's job boards came back as home pages with no search link.
  JOBADABRA_SEARCH_TIER: app
  # Why (13 Nov 2026, bl for sa: a board's "job links" took 80 s on c04 and the log could not say on what): one line per AI call and per slot taken
  # (src/ai/call_log.py, src/ai/slots.py), as search-personas.yml logs its calls; a person's app never sets these.
  JOBADABRA_AI_CALL_LOG: '1'
  JOBADABRA_SLOT_LOG: '1'
  JOBADABRA_STAGE_LOG: ${{ inputs.stage_log && '1' || '' }}   # job_stage.py reads only '1'; '' (unset input) is off

jobs:
  room:
    name: The broker is free and has room
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
      capacity: ${{ steps.capacity.outputs.capacity }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: The broker's claim capacity (the most searches one run holds at once)
        id: capacity
        run: |
          set -o pipefail
          capacity=$(curl -fsS --max-time 20 -A jobadabra-ci https://jobadabra-ai-broker.jobpilotto.workers.dev/health | python3 -c "import json,sys; print(int(json.load(sys.stdin)['claims']['capacity']))") \
            || { echo "::error::the AI broker's /health gave no claims.capacity (unreachable, or a broker without claims): not run"; exit 1; }
          echo "capacity=$capacity" >> "$GITHUB_OUTPUT"
      - name: The profiles of this run
        id: list
        env:
          PROFILES: ${{ inputs.profiles }}
        run: python3 tools/persona-search/profiles.py ids "$PROFILES" >> "$GITHUB_OUTPUT"
      - name: A sane number at once, and this run ends before the night starts (00:00 UTC)
        env:
          PROFILES: ${{ steps.list.outputs.profiles }}
          AT_ONCE: ${{ inputs.at_once || 4 }}
          CAPACITY: ${{ steps.capacity.outputs.capacity }}
        run: |   # the estimate counts what really runs at once
          python3 tools/persona-search/profiles.py free "$PROFILES" "$(( AT_ONCE < CAPACITY ? AT_ONCE : CAPACITY ))"
      - name: The broker's by-hand lane has room for every profile (~300 calls each, as search-personas.yml counts a press)
        env:
          PROFILES: ${{ steps.list.outputs.profiles }}
        run: |
          set -o pipefail
          calls=$(python3 -c "import json,os; print(len(json.loads(os.environ['PROFILES'])) * 300)")
          curl -fsS --max-time 20 https://jobadabra-ai-broker.jobpilotto.workers.dev/health | python3 tools/persona-search/recording_room.py byhand 4 "$calls"

  turn:
    name: Claim room at the broker
    needs: room
    if: ${{ needs.room.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    outputs:
      need: ${{ steps.need.outputs.need }}
    permissions:
      contents: read
      id-token: write   # the broker names the claim from this run's token
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: The searches this run has at once (its at_once, never more than its profiles or the broker's claim capacity)
        id: need
        env:
          AT_ONCE: ${{ inputs.at_once || 4 }}
          PROFILES: ${{ needs.room.outputs.profiles }}
          CAPACITY: ${{ needs.room.outputs.capacity }}
        run: echo "need=$(python3 -c "import json,os; print(min(int(os.environ['AT_ONCE']), len(json.loads(os.environ['PROFILES'])), int(os.environ['CAPACITY'])))")" >> "$GITHUB_OUTPUT"
      - name: Wait our place in line for the searches we run at once
        # Why (13 Nov 2026, owner via sa: "each workflow should take its necessary slots"): the searches at once, at most one per profile (claim.py min below)
        env:
          NEED: ${{ steps.need.outputs.need }}
        run: python3 tools/persona-search/claim.py wait "$NEED"

  profile:
    name: Profile ${{ matrix.profile }}
    needs: [room, turn]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The run token's environment puts these calls on the broker's by-hand lane (jobadabra-web workers/ai-broker/lib/lanes.mjs, web #599). No deployment record.
    environment:
      name: search-check-by-hand
      deployment: false
    permissions:
      contents: read
      id-token: write   # Existing broker authentication: GitHub OIDC, no stored secret.
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.turn.outputs.need) }}   # Why (13 Nov 2026, claims 3/4): exactly the searches the claim holds; at_once (owner, 13 Nov: "make it very parallel" · "customizable") above the broker's capacity runs at it
      matrix:
        profile: ${{ fromJSON(needs.room.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v5   # first: a later checkout cleans the folder and would remove out/
        with: {persist-credentials: false}
      - name: This run can use the AI broker
        id: token
        run: |
          mkdir -p out
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "no trusted GitHub OIDC token for the AI broker" > out/not-run.txt
      - name: Keep the run's claim at the broker while this one searches
        if: steps.token.outputs.ok == 'yes'
        # Why (13 Nov 2026, claims 3/4): the broker drops a claim after 10 min without an ask; this renewer asks at once and every 3 min, and the runner ends it with the job.
        env:
          NEED: ${{ needs.turn.outputs.need }}
        run: nohup python3 tools/persona-search/claim.py hold "$NEED" > "$RUNNER_TEMP/claim-hold.log" 2>&1 &
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'yes'
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Still a sane number at once and before 00:00 UTC (a profile may wait in the matrix)
        id: free
        if: steps.token.outputs.ok == 'yes'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if python3 tools/persona-search/profiles.py free "[\"$PROFILE\"]" 1 > out/free.txt; then echo "ok=yes" >> "$GITHUB_OUTPUT"; else cp out/free.txt out/not-run.txt; fi
          cat out/free.txt
      - name: Electron's zip from the cache (a GitHub 504 only hits a cold cache)
        if: steps.free.outputs.ok == 'yes'
        timeout-minutes: 5
        uses: ./.github/actions/electron-cache
      - name: The engine, the app's libraries and a browser
        if: steps.free.outputs.ok == 'yes'
        run: |
          pip install --quiet -r requirements.txt
          (cd desktop && npm ci && node scripts/stage.mjs --files-only)   # the API engine imports desktop/shared/app-core/ai.js, which stage.mjs generates (#2259)
          (cd desktop/e2e && (npm ci || npm install))
      - name: The browser (cached; a stalled mirror is cut and retried)
        if: steps.free.outputs.ok == 'yes'
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e, mode: both}
      # Why (13 Nov 2026, sa from hb's night finding; owner approved the same for the night, asked via AskUserQuestion: "Yes, night reads like the app (Recommended)"): without the engine's
      # Python renderer careers.renderer() is None, so a job board whose list is built by script reads as "offered as a visit" = 0 jobs, while the app (and the Mac rows) render it. As daily.yml.
      - name: The engine's headless renderer (script-built job boards, as the app reads them)
        id: render
        if: steps.free.outputs.ok == 'yes'
        continue-on-error: true   # never red: a row without the renderer says so in its engine column
        run: pip install --quiet -r requirements-render.txt
      - name: Chromium for the engine's renderer (cached)
        id: render_browser
        if: steps.free.outputs.ok == 'yes'
        continue-on-error: true
        uses: ./.github/actions/playwright-browser
        with: {runtime: python, mode: both}
      - name: A row searched without the renderer is marked
        if: steps.free.outputs.ok == 'yes' && (steps.render.outcome != 'success' || steps.render_browser.outcome != 'success')
        run: echo "the engine's renderer did not install" > out/no-renderer.txt
      - name: The broker answers on the chosen AI (stops the profile if not, so a wrong or dead AI is never a quiet number)
        if: steps.free.outputs.ok == 'yes'
        env:
          ENGINE: ${{ inputs.engine || 'claude' }}
        run: |
          node tools/persona-search/codex.mjs --proof 2>&1 | tee out/proof.txt
          grep -q "AI: $ENGINE / " out/proof.txt || { echo "the broker did not answer on $ENGINE" | tee out/not-run.txt; exit 1; }
      - name: The profile's fictional CV, then its first Find jobs search (the app's tiers through the broker)
        if: steps.free.outputs.ok == 'yes'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          python3 tools/persona-search/profiles.py cv "$PROFILE" out
          node tools/persona-search/codex.mjs -- node tools/persona-search/run.mjs draw "$GITHUB_WORKSPACE/out" --presses 1 --first-only --fresh --engine api --tag profiles 2>&1 | tee out/run.log || true
          python3 tools/persona-search/gate.py extract "$(node -p 'require("os").tmpdir()')/jp-persona-draw-profiles/data/jobs.sqlite" out/jobs.json
      - name: The blind judge (right role, right place; 3 answers, the majority counts)
        if: steps.free.outputs.ok == 'yes'
        env:
          PROFILE: ${{ matrix.profile }}
          JOBADABRA_CHECK_CHAIN: codex,claude   # the judge's AI does not follow the search engine: a Claude round and a Codex round are judged alike
        run: |
          set -o pipefail
          node tools/persona-search/codex.mjs -- python3 tools/persona-search/profiles.py judge "$PROFILE" out/jobs.json out/judged.json 2>&1 | tee out/judge.log || true
      - name: The profile's row
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 tools/persona-search/profiles.py row "$PROFILE" out
      - name: The boards this search read, as names only, to the Scout (never red)
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        # Why (13 Nov 2026, owner via sa: "Any install + our CI searches"): a board our CI read and no install reported never reached the Scout; host names only, a failed post is a warning (tools/persona-search/report_boards.py).
        run: python3 tools/persona-search/report_boards.py out --person "$PROFILE" --run "$GITHUB_RUN_ID" || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: search-profile-${{ matrix.profile }}
          retention-days: 30
          path: out/
      - name: The claim was held all the way
        if: always() && hashFiles('tools/persona-search/claim.py') != ''
        run: if [ -s "$RUNNER_TEMP/claim-hold.log" ]; then { echo "Claim not held all the way (searches may have run without room):"; echo '```'; cat "$RUNNER_TEMP/claim-hold.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

  release:
    name: Give the room back
    needs: [turn, profile]
    if: ${{ always() && needs.turn.result == 'success' }}   # a claim nobody renews frees itself in 10 min anyway
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: python3 tools/persona-search/claim.py release

  table:
    name: The table
    needs: [room, turn, profile]
    if: ${{ always() && needs.room.result == 'success' && needs.turn.result == 'success' }}   # Why (Gitar on #3980): a round that never got its claim ran nothing; its red run says so, never an owner message of "nothing measured"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v7
        with: {pattern: 'search-profile-*', path: results}
      - name: One table for every profile of this run (also on the run's summary page)
        run: |
          python3 tools/persona-search/profiles.py table results results/table.md
          cat results/table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      # Why (13 Nov 2026, owner via sa: one Telegram message per finished run): through the owner's switchboard (event search-profiles, jobadabra-web #602: Engineering, on/off), the CI-alerts
      # bot when the switchboard cannot deliver. Never red: a missing key or a refusal is a line.
      - name: Tell the owner (how many got 0 right jobs, how many meet their EURES count, the table)
        env:
          CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROFILES: ${{ needs.room.outputs.profiles }}   # every profile asked for: one that never uploaded a row is named "not run", never left out (mac-9a, run 43355710034)
          OUTCOME: ${{ needs.profile.result }}   # cancelled = said as cancelled, never "nothing measured"
        run: |
          python3 tools/persona-search/profiles.py tell results/rows.json "$RUN_URL" "$RUNNER_TEMP/message.txt" "$PROFILES" "$OUTCOME" || true   # never red (Gitar on #3945)
          node desktop/e2e/tell-owner.mjs --event search-profiles --file "$RUNNER_TEMP/message.txt" || true
      - uses: actions/upload-artifact@v6
        with:
          name: search-profiles-table
          retention-days: 30
          path: |
            results/table.md
            results/rows.json
