name: Unit
# The desktop tests on Windows, where the app's platform branches really run (Credential Manager instead of the Keychain, python.exe, node-pty, Git Bash for Claude Code).
# A pull request starts it on the same files as the Linux job (tests-desktop.yml: its `paths:` below are a copy, plus this workflow and tools/app-tests.py; tests/tooling/ci/test_workflow_paths.py fails
# when they drift) and runs only the test files the change reaches (tools/affected-tests.py, the picker the Linux job uses; `tools/check.py --plan` says how many, 0 = nothing to run, the job ends green before the dependency install).
# Why (5 Nov 2026, owner: "Yes: reached tests, every PR"; before: "do we need awlays to run all the windows servers on any PR, no matter the changes?"): since 15 Oct a hand-kept list of ~60 files started this job and then ran
# all ~1,000 test files; #3172 changed tools/fixer, no listed file, its PR never ran Windows, and main's Windows was red 12 times on test/tooling/ci/fixer-loop.test.js (4 Nov 23:06 to 5 Nov 01:27 UTC).
# Not a required check (a workflow `paths:` skips never reports). On main, build.yml (CI · Tests) calls it on every push, with every test file.
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '!desktop/e2e/recorded/**'
      - '!desktop/e2e/recorded-pending/**'
      - '!desktop/e2e/fixtures/**'
      - '!desktop/e2e/ladder-fixtures/**'
      - '!desktop/e2e/widget-zoo/**'
      - 'extension/**'
      - 'eslint.config.mjs'
      - 'tools/check.sh'
      - 'tools/check.py'
      # Files outside desktop/ that its tests read (tests/tooling/ci/test_workflow_paths.py fails when one is missing).
      - '.github/workflows/e2e.yml'
      - '.github/workflows/feedback-ai-closed.yml'   # and this one's
      - '.github/workflows/harness.yml'
      - '.github/workflows/integration.yml'   # desktop/test/integration-workflow-paths.test.js reads its paths
      - '.gitignore'
      - 'tools/design-system/**'   # desktop/test/design-system-page.test.js builds the page with it
      - 'docs/rules/desktop-ui.md'
      - 'docs/map/**'   # desktop/test/guards/rules/map-check.test.js checks the map's size, links and anchors
      - 'tools/context/**'   # the map checker it runs
      - 'AGENTS.md'   # the same test asserts it stays under Codex's 32 KiB cap
      - 'docs/rules/agent-detail.md'   # map links point at its anchors
      - '.claude/skills/ui-look-and-feel/SKILL.md'
      - 'src/**'   # settings-paths-exist, bridge-registry, plan-promo, run-lines-plain, site-routes and identity-rule read engine text (#2099 changed only src/ai/decide.py and main went red)
      - 'app-core/src/**'   # identity-rule.test.js, site-routes.test.js
      - 'app-core/test/catalog-parity.js'   # notification catalog tests share the parity assertion
      - 'app-core/test/helpers/panel.js'   # the panel tests load the panel scripts through readPanel
      - 'tests/fixtures/audience_cases.json'   # audience.test.js
      - 'tests/fixtures/swiss_cases.json'
      - 'tools/ship.sh'   # merge-baseline.test.js
      - 'tools/clean-code-js.mjs'   # desktop/test/clean-code-js.test.js, and `npm run lint` runs it on the lines a PR adds
      - 'docs/flows/ladder.md'   # ladder-architecture.test.js checks the rung map against the code
      - 'docs/desktop-ai-mcp.md'   # desktop-ai-docs.test.js checks every tool is named in it
      - 'config/notion_schema.json'
      - 'config/notion_template.json'
