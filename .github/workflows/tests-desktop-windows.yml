permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read

concurrency:   # a PR's newer push replaces its older run and frees its runner; each commit of main keeps its own run (tests/test_main_runs_finish.py, tests/test_pr_runs_cancel.py)
  group: tests-desktop-windows-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: desktop (Windows)
    # fail-fast off, matrix of one: the row reads "Unit / desktop (Windows)" since 5 Nov 2026 (a8 1/4).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash   # `npm test` globs test/*.test.js, which pwsh would hand to node unexpanded
    env:
      # A PR: leave out lint, and run the files its change reaches (HEAD^1 is the PR's base). Main (build.yml calls this file on every push): everything, as the empty string says.
      CHECK_ARGS: ${{ github.event_name == 'pull_request' && '--app-only --affected-from HEAD^1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # a PR's merge commit and its base: HEAD^1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Why (5 Nov 2026, owner: "Yes: reached tests, every PR"): the picker needs node (its data and e2e readers), so this comes after setup-node. The output is a count, or the word all.
      - name: Which test files this change reaches
        id: plan
        run: |
          # shellcheck disable=SC2086  # CHECK_ARGS is several words
          tests="$(python tools/check.py --plan --area desktop $CHECK_ARGS | tail -n 1)"
          case "$tests" in all | [0-9]*) ;; *) tests=all ;; esac   # anything else runs everything
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Windows runs: $tests desktop test files (main runs all)"
          if [ "$tests" = "0" ]; then echo "No desktop test file is reached by this change: nothing to run on Windows." >> "$GITHUB_STEP_SUMMARY"; fi
      # Install exactly what a developer (and the release workflow) has, dev dependencies included: `npm test` runs scripts/stage.mjs, which needs esbuild.
      # Only Electron's large binary is skipped, as the tests don't start it. tools/pre-push-check.sh blocks `--omit` here.
      - run: npm ci
        if: steps.plan.outputs.tests != '0'
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Why (4 Nov 2026, owner: "Leave them out"; PR time 1/2): a PR's Windows run was the slowest job on 10 of 25 PRs. Lint reads the same files on Linux, and the tooling tests are git-spawn bound
      # here (one file 109 s, 10 s on Linux). A PR leaves lint out; a PR's full fallback (`all`: a dependency file, the test runner) also leaves out the tooling tests; both still run on Windows after each merge.
      # Why (5 Nov 2026, owner: "Yes: reached tests, every PR"): a tooling test the change reaches stays in the picked list (#3172: test/tooling/ci/fixer-loop.test.js).
      - if: steps.plan.outputs.tests != '0'
        run: |
          # shellcheck disable=SC2086  # CHECK_ARGS is several words
          bash tools/check.sh --area desktop $CHECK_ARGS
